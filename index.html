<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pocket Droidex" />
<link rel="manifest" href="manifest.json" />
<title>Pocket Droidex</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0b0818; --bg2:#16122a; --card:#15122b; --line:#2b2550;
    --ink:#ece8ff; --muted:#8b85b3; --gold:#c4b5fd; --gold2:#ddd6fe;
    --green:#4ade80; --green-bg:rgba(74,222,128,.12);
    --common:#a78bfa; --rare:#60a5fa; --epic:#c084fc;
    --legendary:#fbbf24; --mythic:#fecaca; --iconic:#f472b6; --fusion:#2dd4bf;
    --gal:#e879f9; --gal-hi:#f5d0fe; --gal-line:#c026d3; --gal-bg:#120218;
    --myth-hi:#fecaca; --myth-line:#7f1d1d; --myth-bg:#16080a;
    --stel:#fbbf24; --stel-hi:#fef3c7; --stel-line:#f59e0b; --stel-bg:#0a0804;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#05030c; color:var(--ink); font-family:"Exo 2",sans-serif; }
  body { padding-bottom: 24px; }
  #space { position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; }
  .nebula {
    position:fixed; z-index:0; pointer-events:none; filter:blur(40px); opacity:.45;
    animation:drift 80s ease-in-out infinite alternate;
  }
  .nebula.a { width:55vw; height:40vw; left:-8vw; top:8vh; background:radial-gradient(circle, #3b0764 0%, transparent 70%); }
  .nebula.b { width:48vw; height:36vw; right:-10vw; top:28vh; background:radial-gradient(circle, #083344 0%, transparent 70%); animation-duration:110s; }
  .nebula.c { width:40vw; height:30vw; left:20vw; bottom:-8vh; background:radial-gradient(circle, #4a044e 0%, transparent 72%); animation-duration:95s; }
  .planet {
    position:fixed; z-index:0; pointer-events:none; border-radius:50%;
    box-shadow:inset -6px -4px 12px rgba(0,0,0,.55), 0 0 18px rgba(255,255,255,.08);
    animation:orbit 120s linear infinite;
  }
  .planet.p1 { width:22px; height:22px; right:12vw; top:18vh; background:radial-gradient(circle at 35% 30%, #fde68a, #b45309 60%, #1c0a06); animation-duration:160s; }
  .planet.p2 { width:14px; height:14px; left:8vw; top:42vh; background:radial-gradient(circle at 30% 30%, #93c5fd, #1d4ed8 62%, #0b1220); animation-duration:210s; }
  .planet.p3 { width:9px; height:9px; right:22vw; bottom:16vh; background:radial-gradient(circle at 40% 30%, #fda4af, #9f1239 70%, #1c0a0e); animation-duration:180s; }
  @keyframes drift { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(6vw,-4vh,0) scale(1.08); } }
  @keyframes orbit { from { transform:translate3d(0,0,0); } to { transform:translate3d(-3vw,2vh,0); } }
  header { position:sticky; top:0; z-index:20; background:linear-gradient(180deg,rgba(5,3,12,.82) 60%,rgba(5,3,12,.55)); border-bottom:1px solid var(--line); padding:12px 14px 10px; backdrop-filter:blur(8px); }
  main { position:relative; z-index:1; }
  h1 { margin:0; font-size:0; line-height:0; }
  .brand { display:block; width:min(280px,72vw); height:auto; margin:0 auto 2px; }
  .sub { color:var(--muted); font-size:11px; margin-top:2px; text-align:center; font-family:Orbitron,sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  .belts { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px; }
  .belt { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 6px; text-align:center; }
  .belt b { display:block; font-size:16px; font-variant-numeric:tabular-nums; color:var(--gold2); font-family:Orbitron,sans-serif; letter-spacing:.08em; }
  .belt span { font-size:9px; color:var(--muted); letter-spacing:.18em; text-transform:uppercase; font-family:Orbitron,sans-serif; }
  .belt.soon { box-shadow:0 0 14px rgba(255,255,255,.12); }
  .belt.gal { background:radial-gradient(circle at 50% 0%, #4a0a63, #120218 70%); border-color:#d946ef; }
  .belt.gal b { color:#f5d0fe; text-shadow:0 0 10px #e879f9; }
  .belt.gal span { color:#e879f9; }
  .belt.myth { background:var(--myth-bg); border-color:var(--myth-line); }
  .belt.myth b { color:var(--myth-hi); }
  .belt.myth span { color:#f87171; }
  .belt.stel { background:radial-gradient(circle at 50% 120%, #7c4a08, #0a0804 62%); border-color:#f59e0b; }
  .belt.stel b { color:#fef3c7; text-shadow:0 0 10px #fbbf24; }
  .belt.stel span { color:#fbbf24; }
  .chk.v-def { color:#9ca3af; background:#141416; border-color:#4b5563; }
  .chk.v-def.on { color:#d1d5db; background:#1f2933; border-color:#6b7280; }
  .chk.v-gld { color:#facc15; background:linear-gradient(180deg,#3a2a08,#0c0a06); border-color:#ca8a04; }
  .chk.v-gld.on { color:#fef08a; background:linear-gradient(180deg,#5a430c,#161008); border-color:#facc15; box-shadow:0 0 10px rgba(250,204,21,.28); }
  .chk.v-dia {
    color:#a5f3fc; border-color:#22d3ee;
    background:
      radial-gradient(circle at 50% 0%, rgba(34,211,238,.28), transparent 55%),
      radial-gradient(circle at 18% 22%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 78% 30%, #67e8f9 0 1px, transparent 2px),
      #030712;
  }
  .chk.v-dia.on {
    color:#ecfeff; border-color:#67e8f9;
    box-shadow:0 0 12px rgba(34,211,238,.4);
    background:
      radial-gradient(circle at 50% 0%, rgba(103,232,249,.4), transparent 60%),
      radial-gradient(circle at 22% 18%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 70% 40%, #a5f3fc 0 1px, transparent 2px),
      #04131c;
  }
  .chk.v-rbw {
    color:#fff;
    border-color:#a3e635;
    background:
      linear-gradient(135deg, rgba(163,230,53,.55), rgba(34,211,238,.45) 35%, rgba(168,85,247,.5) 65%, rgba(244,114,182,.5));
  }
  .chk.v-rbw.on {
    color:#fff;
    border-color:#f0abfc;
    box-shadow:0 0 12px rgba(168,85,247,.35);
    background:
      linear-gradient(135deg, #a3e635, #22d3ee 30%, #a855f7 62%, #f472b6);
  }
  .chk.v-bsk { color:#e8b896; background:linear-gradient(180deg,#3f2a1e,#1c1410); border-color:#9a6b4a; }
  .chk.v-bsk.on { color:#f5e6d3; background:linear-gradient(180deg,#5a3b28,#241810); border-color:#d6a07a; box-shadow:0 0 8px rgba(214,160,122,.28); }
  .chk.v-gal { color:#f0abfc; background:radial-gradient(circle at 30% 0%, #3b0764, #120218 72%); border-color:#c026d3; }
  .chk.v-gal.on { color:#fce7ff; background:radial-gradient(circle at 30% 0%, #6b21a8, #1a0424 75%); border-color:#e879f9; box-shadow:0 0 10px rgba(232,121,249,.35); }
  .chk.v-stel { color:#fde047; background:radial-gradient(circle at 30% 0%, #7c4a08, #0a0804 72%); border-color:#d97706; }
  .chk.v-stel.on { color:#fffbeb; background:radial-gradient(circle at 30% 0%, #b45309, #120a04 75%); border-color:#fbbf24; box-shadow:0 0 10px rgba(251,191,36,.4); }
  .chk.v-myth { color:#f87171; background:var(--myth-bg); border-color:var(--myth-line); }
  .chk.v-myth.on { color:var(--myth-hi); background:rgba(239,68,68,.18); border-color:#ef4444; }
  details.tier.v-def { border-color:#4b5563; background:#141416; }
  details.tier.v-def > summary { color:#d1d5db; }
  details.tier.v-gld { border-color:#ca8a04; background:linear-gradient(180deg,#2a1e08,#0c0a06); }
  details.tier.v-gld > summary { color:#fde047; }
  details.tier.v-dia { border-color:#22d3ee; background:radial-gradient(circle at 12% 0%, #083344, #030712 70%); }
  details.tier.v-dia > summary { color:#a5f3fc; }
  details.tier.v-rbw { border-color:#a855f7; background:linear-gradient(135deg,#365314,#164e63 40%, #3b0764 75%, #4a044e); }
  details.tier.v-rbw > summary { color:#ecfccb; }
  details.tier.v-bsk { border-color:#9a6b4a; background:linear-gradient(180deg,#3f2a1e,#1c1410); }
  details.tier.v-bsk > summary { color:#f5e6d3; }
  details.tier.v-gal { border-color:#c026d3; background:radial-gradient(circle at 8% 0%, #3b0764, #120218 68%); }
  details.tier.v-gal > summary { color:#f5d0fe; }
  details.tier.v-stel { border-color:#d97706; background:radial-gradient(circle at 8% 0%, #7c4a08, #0a0804 68%); }
  details.tier.v-stel > summary { color:#fef3c7; }
  details.tier.v-myth { border-color:var(--myth-line); background:var(--myth-bg); }
  details.tier.v-myth > summary { color:var(--myth-hi); }
  .card.theme-gal { background:radial-gradient(circle at 12% 0%, #4a0a63, #120218 62%); border-color:#d946ef; }
  .card.theme-myth { background:linear-gradient(180deg,#2a0c10,#16080a); border-color:var(--myth-line); }
  .card.theme-stel { background:radial-gradient(circle at 12% 110%, #7c4a08, #0a0804 58%); border-color:#f59e0b; }
  .rarity-h.Mythic { color:var(--myth-hi); }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:10px; }
  @media (max-width:560px){ .stats { grid-template-columns:repeat(3,1fr); } }
  .stat { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:16px; padding:8px 4px; text-align:center; }
  .stat .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#3f6212,#84cc16 55%,#d9f99d); opacity:.42; pointer-events:none; transition:width .25s ease; }
  .stat b, .stat span { position:relative; z-index:1; }
  .stat b { display:block; font-size:15px; color:var(--gold2); font-family:Orbitron,sans-serif; letter-spacing:.06em; }
  .stat span { font-size:9px; color:var(--muted); font-family:Orbitron,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  .toolbar { display:flex; gap:8px; margin-top:10px; }
  input[type="search"], select {
    flex:1; background:rgba(12,10,24,.78); color:var(--ink); border:1px solid var(--line);
    border-radius:16px; padding:10px 12px; font-size:13px; outline:none;
    font-family:Orbitron,sans-serif; letter-spacing:.06em;
  }
  .tabs { display:flex; flex-direction:column; gap:4px; margin-top:10px; }
  .tabrow { display:grid; gap:4px; }
  .tabrow.row1 { grid-template-columns:repeat(4,1fr); }
  .tabrow.row2 { grid-template-columns:repeat(4,1fr); }
  .tabs button { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:14px; color:var(--muted); padding:9px 2px; font-size:10px; font-weight:700; font-family:Orbitron,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .tabs button .fill { position:absolute; left:0; top:0; bottom:0; width:0; opacity:.42; pointer-events:none; transition:width .25s ease; }
  .tabs button span { position:relative; z-index:1; }
  .tabs button.on { color:#fff; background:rgba(196,181,253,.12); border-color:#c4b5fd; }
  .tabs button[data-tab="droidex"] .fill { background:linear-gradient(90deg,#0e7490,#67e8f9); }
  .tabs button[data-tab="fusion"] .fill { background:linear-gradient(90deg,#0f766e,#2dd4bf); }
  .tabs button[data-tab="srb"] .fill { background:linear-gradient(90deg,#c2410c,#fb923c); }
  .tabs button[data-tab="done"] .fill { background:linear-gradient(90deg,#166534,#4ade80); }
  .tabs button[data-tab="iconics"] .fill { background:linear-gradient(90deg,#9d174d,#f472b6); }
  .tabs button[data-tab="cosmetics"] .fill { background:linear-gradient(90deg,#5b21b6,#c4b5fd); }
  .tabs button[data-tab="saves"] .fill { background:linear-gradient(90deg,#334155,#94a3b8); }
  .tabs button[data-tab="alarms"] .fill { background:linear-gradient(90deg,#a16207,#fbbf24); }
  main { padding:12px; }
  .hint { background:rgba(12,10,24,.72); border:1px solid var(--line); border-radius:16px; padding:12px 14px; color:var(--muted); font-size:13px; line-height:1.45; margin-bottom:12px; }
  .rarity-h { position:sticky; top:248px; z-index:10; margin:14px 0 8px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); background:rgba(5,3,12,.72); padding:6px 2px; font-family:Orbitron,sans-serif; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:720px){ .grid { grid-template-columns:1fr 1fr; } }
  .card { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:16px; padding:12px; }
  .card > i.fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#365314,#84cc16 70%,#d9f99d); opacity:.28; pointer-events:none; }
  .card.done { border-color:rgba(74,222,128,.35); }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pic { width:52px; height:52px; border-radius:10px; overflow:hidden; flex:none; background:#000; border:1px solid var(--line); position:relative; }
  .pic img, .pic svg { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .pic svg.glyph { position:absolute; inset:0; }
  .name { font-weight:800; font-size:13px; font-family:Orbitron,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  .meta { color:var(--muted); font-size:10px; margin-top:3px; font-family:Orbitron,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .grow { flex:1; min-width:0; }
  .badge { font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 8px; border-radius:12px; border:1px solid currentColor; white-space:nowrap; font-family:Orbitron,sans-serif; }
  .Common{color:var(--common)} .Rare{color:var(--rare)} .Epic{color:var(--epic)}
  .Legendary{color:var(--legendary)} .Mythic{color:var(--mythic)} .Iconic{color:var(--iconic)} .Fusion{color:var(--fusion)}
  .vars { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }
  .chk { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:8px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:#100d22; border:1px solid var(--line); border-radius:12px; font-family:Orbitron,sans-serif; padding:7px 2px; min-height:44px; }
  .chk.on { color:var(--green); background:var(--green-bg); border-color:rgba(61,214,140,.4); }
  .chk input { accent-color:var(--green); width:15px; height:15px; }
  .fl-pill { display:flex; align-items:center; gap:6px; background:#100d22; border:1px solid var(--line); border-radius:14px; padding:8px 10px; font-size:10px; color:var(--muted); white-space:nowrap; flex:none; font-family:Orbitron,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .fl-pill.on { color:var(--green); background:var(--green-bg); border-color:rgba(61,214,140,.4); }
  .fl-pill input { accent-color:var(--green); width:15px; height:15px; }
  .tier { margin-top:8px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:0; }
  .tier h3 { margin:0 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold2); display:flex; justify-content:space-between; align-items:center; }
  .ings { display:flex; flex-direction:column; gap:5px; padding:0 8px 8px; }
  .ings .chk { flex-direction:row; justify-content:flex-start; text-transform:none; letter-spacing:0; font-size:12px; min-height:0; padding:7px 8px; }
  details.drop { padding:0; }
  details.drop > summary { list-style:none; cursor:pointer; padding:12px; display:flex; gap:8px; align-items:center; }
  details.drop > summary::-webkit-details-marker { display:none; }
  details.drop .drop-body { padding:0 12px 12px; }
  .chev { margin-left:auto; color:var(--muted); font-size:16px; transition:transform .15s; }
  details[open] > summary .chev { transform:rotate(90deg); }
  details.tier { margin-top:6px; position:relative; overflow:hidden; }
  details.tier > i.fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#9a3412,#fb923c 70%,#fed7aa); opacity:.32; pointer-events:none; }
  details.tier > summary { list-style:none; cursor:pointer; padding:9px 10px; display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold2); font-family:Orbitron,sans-serif; }
  details.tier > summary::-webkit-details-marker { display:none; }
  details.tier > summary .chev { font-size:13px; }
  .ready { margin-top:6px; font-size:11px; font-weight:800; color:var(--gold); }
  .empty { text-align:center; color:var(--muted); padding:36px 12px; }
  .cycles { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; }
  .cycles button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:14px; padding:7px 10px; font-size:10px; font-weight:700; font-family:Orbitron,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .cycles button.on { color:#0b1220; background:var(--gold); border-color:var(--gold); }
  .rb-row { display:flex; flex-direction:column; gap:6px; }
  .rb-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rb-cost { color:var(--gold2); font-size:12px; font-weight:700; }
  .srb { font-size:10px; color:var(--gold); font-weight:800; letter-spacing:.04em; }
  .saves { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .saves select, .saves button, .act button {
    background:var(--bg2); color:var(--ink); border:1px solid var(--line);
    border-radius:14px; padding:8px 10px; font-size:11px; font-weight:700;
    font-family:Orbitron,sans-serif; letter-spacing:.08em; text-transform:uppercase;
  }
  .act { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 14px; }
  .act .danger { background:#3b1020; color:#fb7185; border-color:#7f1d3a; }
  .modal { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; padding:16px; }
  .modal.hidden { display:none; }
  .sheet { width:min(440px,100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .sheet h2 { margin:0 0 6px; font-size:18px; }
  .sheet p { margin:0 0 14px; color:var(--muted); font-size:13px; line-height:1.45; }
  .sheet .row { display:flex; gap:8px; }
  .sheet .row button { flex:1; border-radius:10px; padding:12px; font-weight:800; border:1px solid var(--line); background:var(--bg2); color:var(--ink); }
  .sheet .row .danger { background:#3b1020; color:#fb7185; border-color:#7f1d3a; }
  #alarmToast {
    position:fixed; left:12px; right:12px; top:12px; z-index:90; display:none;
    text-align:center; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    padding:12px 14px; border-radius:12px; border:1px solid #fbbf24; background:#1a1206; color:#fef3c7;
  }
  #alarmToast.show { display:block; }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="nebula a"></div>
<div class="nebula b"></div>
<div class="nebula c"></div>
<div class="planet p1"></div>
<div class="planet p2"></div>
<div class="planet p3"></div>
<header>
  <h1>Pocket Droidex</h1>
  <img class="brand" src="img/pocket-droidex.jpg" alt="Pocket Droidex" />
  <div class="sub">Profile: <span id="saveLabel">Main</span></div>
  <div class="belts">
    <div class="belt gal" id="beltGal"><b>--</b><span>Galactic</span></div>
    <div class="belt myth" id="beltMyth"><b>--</b><span>Mythic</span></div>
    <div class="belt stel" id="beltStel"><b>--</b><span>Stellar</span></div>
  </div>
  <div class="stats">
    <div class="stat"><i class="fill" id="fillNames"></i><b id="sNames">0</b><span>Droids</span></div>
    <div class="stat"><i class="fill" id="fillVars"></i><b id="sVars">0</b><span>Variants</span></div>
    <div class="stat"><i class="fill" id="fillFuse"></i><b id="sFuse">0/17</b><span>Fusion</span></div>
    <div class="stat"><i class="fill" id="fillDone"></i><b id="sDone">0</b><span>Completed</span></div>
    <div class="stat"><i class="fill" id="fillFlaw"></i><b id="sFlaw">0</b><span>Flawless</span></div>
  </div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search droids…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="droidex-search" />
    <select id="filter">

const KEY = "droidex-v2";
const SAVES_KEY = "droidex-saves";
function blankState(cycle){ return {d:{},f:{},i:{},c:{},rb:{cycle:cycle||1}}; }
let state = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("droidex-v1") || '{"d":{},"f":{},"i":{},"c":{}}');
if (!state.rb) state.rb = {};
let tab = "droidex";
let srbCycle = Number(state.rb.cycle || 1);
function loadBank(){
  try {
    const raw = JSON.parse(localStorage.getItem(SAVES_KEY) || "null");
    if (raw && raw.slots && raw.current && raw.slots[raw.current]) return raw;
  } catch(e){}
  return { current:"main", slots:{ main:{ name:"Main", updated:Date.now(), state } } };
}
let bank = loadBank();
if (bank.slots[bank.current] && bank.slots[bank.current].state) {
  state = bank.slots[bank.current].state;
  if (!state.rb) state.rb = {};
  srbCycle = Number(state.rb.cycle || 1);
}
function writeBank(){
  if (!bank.slots[bank.current]) bank.slots[bank.current] = { name:"Main", updated:Date.now(), state };
  bank.slots[bank.current].state = state;
  bank.slots[bank.current].updated = Date.now();
  localStorage.setItem(SAVES_KEY, JSON.stringify(bank));
  localStorage.setItem(KEY, JSON.stringify(state));
}
function save(){ writeBank(); updateStats(); updateSaveLabel(); }
function applyState(st){
  state = JSON.parse(JSON.stringify(st));
  if (!state.d) state.d = {};
  if (!state.f) state.f = {};
  if (!state.i) state.i = {};
  if (!state.c) state.c = {};
  if (!state.rb) state.rb = {};
  srbCycle = Number(state.rb.cycle || 1);
}
function currentName(){ return (bank.slots[bank.current]||{}).name || "Main"; }
function updateSaveLabel(){
  const el = document.getElementById("saveLabel");
  if (el) el.textContent = currentName();
  const pick = document.getElementById("savePick");
  if (pick){
    pick.innerHTML = Object.keys(bank.slots).map(id => {
      const s = bank.slots[id];
      return `<option value="${id}" ${id===bank.current?"selected":""}>${s.name}</option>`;
    }).join("");
  }
}
function savePanel(){
  let html = `<div class="hint">Each profile is a separate checklist. Download a file to keep a copy. Load a file to come back to that point.</div>`;
  html += `<div class="card"><div class="name">${currentName()}</div><div class="meta" style="margin:4px 0 8px">Active profile on this device</div><div class="saves">`;
  html += `<select onchange="switchSave(this.value)">`;
  Object.keys(bank.slots).forEach(id => {
    const s = bank.slots[id];
    html += `<option value="${id}" ${id===bank.current?"selected":""}>${s.name}</option>`;
  });
  html += `</select></div><div class="act">`;
  html += `<button onclick="newSave(true)">Save as new</button>`;
  html += `<button onclick="newSave(false)">New blank</button>`;
  html += `<button onclick="renameSave()">Rename</button>`;
  html += `<button onclick="downloadSave()">Download file</button>`;
  html += `<button onclick="document.getElementById('loadFile').click()">Load file</button>`;
  html += `<button onclick="deleteSave()">Delete profile</button>`;
  html += `</div></div>`;
  return html;
}
function switchSave(id){
  if (!bank.slots[id]) return;
  writeBank();
  bank.current = id;
  applyState(bank.slots[id].state);
  writeBank();
  render();
}
function newSave(copy){
  const name = prompt(copy ? "Name this copy of your current save:" : "Name the new blank save:", copy ? currentName()+" copy" : "Save "+(Object.keys(bank.slots).length+1));
  if (!name) return;
  writeBank();
  const id = "s"+Date.now();
  const st = copy ? JSON.parse(JSON.stringify(state)) : blankState(srbCycle);
  bank.slots[id] = { name:name.trim(), updated:Date.now(), state:st };
  bank.current = id;
  applyState(st);
  writeBank();
  render();
}
function renameSave(){
  const name = prompt("Rename this save:", currentName());
  if (!name) return;
  bank.slots[bank.current].name = name.trim();
  writeBank();
  render();
}
function deleteSave(){
  if (Object.keys(bank.slots).length < 2) { alert("Keep at least one save."); return; }
  if (!confirm("Are you sure?\n\nDelete save “"+currentName()+"”? This cannot be undone unless you downloaded a file.")) return;
  delete bank.slots[bank.current];
  bank.current = Object.keys(bank.slots)[0];
  applyState(bank.slots[bank.current].state);
  writeBank();
  render();
}
function downloadSave(){
  writeBank();
  const payload = { name: currentName(), saved: new Date().toISOString(), state };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
  a.download = currentName().replace(/[^\w.-]+/g,"_")+".json";
  a.click();
}
function importSave(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const st = data.state || data;
      if (!st || typeof st !== "object") throw new Error("bad");
      if (!st.d) st.d = {};
      writeBank();
      const id = "s"+Date.now();
      bank.slots[id] = { name:(data.name || file.name.replace(/\.json$/i,"").replace(/_/g," ")), updated:Date.now(), state:st };
      bank.current = id;
      applyState(st);
      writeBank();
      render();
    } catch(e) { alert("Could not read that save file."); }
  };
  reader.readAsText(file);
}
function askSuperRebirth(){

}
function closeModal(){ document.getElementById("modal").classList.add("hidden"); document.getElementById("modal").innerHTML=""; }
function doSuperRebirth(){

  const id = "s"+Date.now();

function dKey(n,v){ return n+"|"+v; }
function has(n,v){ return !!state.d[dKey(n,v)]; }
function toggle(n,v){ state.d[dKey(n,v)] = !state.d[dKey(n,v)]; save(); render(); }
function completeAll(n){
  const allOn = VARIANTS.every(v => has(n,v));
  VARIANTS.forEach(v => { state.d[dKey(n,v)] = !allOn; });
  save(); render();
}
function markTier(n,v,on){
  if (on) state.d[dKey(n,v)] = true;
  else delete state.d[dKey(n,v)];
}
function fusionIngs(name){
  const row = FUSIONS.find(([n]) => n===name);
  return row ? row[3] : [];
}
function setFusionVariant(name,v,on){
  const ings = fusionIngs(name);
  state.f[name+"|"+v] = !!on;
  ings.forEach((ing,i) => {
    state.f[name+"|"+v+"|i"+i] = !!on;
    if (on) state.d[dKey(ing,v)] = true;
  });
}
function toggleFusionVariant(name,v,on){
  setFusionVariant(name,v,on);
  save(); render();
}
function toggleFusionIng(name,v,i,ing,on){
  state.f[name+"|"+v+"|i"+i] = !!on;
  if (on) state.d[dKey(ing,v)] = true;
  save(); render();
}
function completeFusion(name){
  const ings = fusionIngs(name);
  const allOn = VARIANTS.every(v => fuseHas(name,v) && ings.every((_,i)=>fuseIng(name,v,i)));
  VARIANTS.forEach(v => setFusionVariant(name,v,!allOn));
  save(); render();
}
function rebirthNeeds(key){
  const m = /^c(\d+)r(\d+)$/.exec(key);
  if (!m) return [];
  const cyc = CYCLES[Number(m[1])] || [];
  return cyc[Number(m[2])-1] || [];
}
function toggleRebirth(key,on){
  state.rb[key] = !!on;
  if (on) rebirthNeeds(key).forEach(([n,t]) => { state.d[dKey(n,t)] = true; });
  save(); render();
}
function ownedTiers(n){ return VARIANTS.filter(v => has(n,v)).length; }
function fuseHas(n,v){ return !!state.f[n+"|"+v]; }
function fuseIng(n,v,i){ return !!state.f[n+"|"+v+"|i"+i]; }
function fuseTiers(n){ return VARIANTS.filter(v => fuseHas(n,v)).length; }
function iconOwned(n){ return !!state.i[n]; }
function droidDone(n){ return ownedTiers(n)===7; }
function fuseDone(n){ return fuseTiers(n)===7; }
function iconDone(n){ return iconOwned(n); }
function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function bestTier(n){
  let best = -1;
  VARIANTS.forEach(v => { if (has(n,v) || fuseHas(n,v)) best = Math.max(best, TIER_I[v]); });
  return best;
}
function meets(n, min){ return bestTier(n) >= TIER_I[min]; }

function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h); return Math.abs(h); }
const SHORT = {Basic:"DEF",Gold:"GLD",Diamond:"DIA",Rainbow:"RBW",Beskar:"BSK",Galactic:"GLC",Stellar:"STL"};
const VNAME = {Basic:"Default",Gold:"Gold",Diamond:"Diamond",Rainbow:"Rainbow",Beskar:"Beskar",Galactic:"Galactic",Stellar:"Stellar"};
function vName(v){ return VNAME[v] || v; }
function vTheme(v){
  if (v==="Basic") return "v-def";
  if (v==="Gold") return "v-gld";
  if (v==="Diamond") return "v-dia";
  if (v==="Rainbow") return "v-rbw";
  if (v==="Beskar") return "v-bsk";
  if (v==="Galactic") return "v-gal";
  if (v==="Stellar") return "v-stel";
  return "";
}
function rarTheme(r){ return r==="Mythic" ? "theme-myth" : ""; }
function hexFrom(n,s){ const h=hash(n+s); return "#"+((h&0xffffff)|0x202020).toString(16).padStart(6,"0"); }
function portrait(name, typ){
  const h = hash(name);
  const skin = typ==="Worker"||typ==="Fusion" ? "#4ade80" : (typ==="Astromech"||typ==="Iconic" ? "#c4b5fd" : "#fb7185");
  const body = hexFrom(name,"b");
  const acc = hexFrom(name,"a");
  const eye = (h%5)+8;
  if (typ==="Astromech" || typ==="Iconic") {
    return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><ellipse cx="40" cy="28" rx="22" ry="16" fill="${body}"/><rect x="18" y="28" width="44" height="36" rx="8" fill="${body}"/><rect x="22" y="34" width="36" height="8" rx="2" fill="${acc}"/><circle cx="40" cy="24" r="5" fill="${skin}"/><circle cx="40" cy="24" r="2" fill="#0b0818"/><rect x="${eye+10}" y="50" width="${48-eye}" height="4" rx="2" fill="#0b0818"/><rect x="34" y="62" width="12" height="8" fill="${acc}"/></svg>`;
  }
  if (typ==="Battle") {
    return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><rect x="28" y="12" width="24" height="20" rx="6" fill="${body}"/><rect x="22" y="30" width="36" height="28" rx="6" fill="${body}"/><circle cx="34" cy="20" r="3" fill="${skin}"/><circle cx="46" cy="20" r="3" fill="${skin}"/><rect x="18" y="34" width="10" height="22" rx="4" fill="${acc}"/><rect x="52" y="34" width="10" height="22" rx="4" fill="${acc}"/><rect x="30" y="58" width="8" height="16" fill="${body}"/><rect x="42" y="58" width="8" height="16" fill="${body}"/></svg>`;
  }
  return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><rect x="16" y="22" width="48" height="40" rx="8" fill="${body}"/><circle cx="28" cy="38" r="6" fill="#0b0818"/><circle cx="52" cy="38" r="6" fill="#0b0818"/><circle cx="28" cy="38" r="2.5" fill="${skin}"/><circle cx="52" cy="38" r="2.5" fill="${skin}"/><rect x="24" y="50" width="32" height="6" rx="2" fill="${acc}"/><rect x="30" y="14" width="20" height="10" rx="3" fill="${acc}"/></svg>`;
}

function updateStats(){
  const names = DROIDS.filter(([n]) => ownedTiers(n)>0).length + FUSIONS.filter(([n]) => fuseTiers(n)>0).length;
  const totalNames = DROIDS.length + FUSIONS.length;

             + VARIANTS.reduce((a,v)=>a+FUSIONS.filter(([n])=>fuseHas(n,v)).length,0);

  const flaw = DROIDS.filter(([n])=>has(n,"Flawless")).length + FUSIONS.filter(([n])=>fuseHas(n,"Flawless")).length;

  bar("fillFlaw", flaw, totalNames);
  const droidVars = VARIANTS.reduce((a,v)=>a+DROIDS.filter(([n])=>has(n,v)).length,0);
  const fuseVars = VARIANTS.reduce((a,v)=>a+FUSIONS.filter(([n])=>fuseHas(n,v)).length,0);
  const rbCleared = Array.from({length:35},(_,i)=>i+1).filter(rb => state.rb && state.rb["c"+srbCycle+"r"+rb]).length;
  const icOn = ICONICS.filter(([n])=>iconOwned(n)).length;
  const paintOn = COSMETICS.filter((_,i)=>state.c && state.c[i]).length;
  const alarmOn = ["Galactic","Mythic","Stellar"].filter(n => alarms[n] && alarms[n].on).length;

function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function showCard(name, typ, extra){
  const q = norm(document.getElementById("q").value);
  const t = document.getElementById("filter").value;
  if (q) {
    const blob = norm([name, typ, extra||""].join(" "));
    if (!blob.includes(q) && !norm(name).includes(q)) return false;
  }
  if (t!=="all" && typ!==t) return false;
  return true;
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function assetName(name){
  return name.toUpperCase().replace(/\s+/g,"_");
}
function picWrap(name,typ,rar){
  const a = "img/" + assetName(name) + "_DEFAULT.png";
  const b = "img/" + slug(name) + ".jpg";
  return `<div class="pic"><img alt="${name}" src="${a}" onerror="if(this.dataset.n!=='1'){this.dataset.n='1';this.src='${b}';}else{this.style.display='none';this.nextElementSibling.style.display='block';}">${portrait(name,typ)}</div>`;
}

const openD = {};
function renderDroidCard(name,typ,rar,hideDone){
  if (hideDone && droidDone(name)) return "";
  if (!showCard(name,typ,rar)) return "";
  const tiers = ownedTiers(name);
  const opened = openD[name] ? "open" : "";
  const fl = has(name,"Flawless");
  const allOn = tiers===7;
  let html = `<details class="card drop ${tiers===7?"done":""} ${rarTheme(rar)}" ${opened} ontoggle="openD['${esc(name)}']=this.open"><i class="fill" style="width:${(tiers/7*100).toFixed(1)}%"></i><summary><div class="top" style="flex:1">${picWrap(name,typ,rar)}<div class="grow"><div class="name">${name.toUpperCase()}</div><div class="meta">${typ.toUpperCase()} · ${tiers}/7</div></div><label class="fl-pill ${fl?"on":""}" onclick="event.stopPropagation()"><input type="checkbox" ${fl?"checked":""} onchange="toggle('${esc(name)}','Flawless')">Flawless</label></div><span class="chev">▸</span></summary><div class="drop-body"><div class="vars">`;
  VARIANTS.forEach(v => {
    const on = has(name,v);
    html += `<label class="chk ${on?"on":""} ${vTheme(v)}"><input type="checkbox" ${on?"checked":""} onchange="toggle('${esc(name)}','${v}')">${SHORT[v]}</label>`;
  });
  html += `</div><div class="vars" style="grid-template-columns:1fr;margin-top:6px"><label class="chk ${allOn?"on":""}" style="flex-direction:row;min-height:0;padding:8px;text-transform:none;letter-spacing:0;font-size:12px"><input type="checkbox" ${allOn?"checked":""} onchange="completeAll('${esc(name)}')">Complete All</label></div></div></details>`;
  return html;
}

const openF = {};
const openV = {};
const openG = {};
const openR = {};
function renderFusionCard(name,rar,typ,ings,hideDone){
  if (hideDone && fuseDone(name)) return "";
  if (!showCard(name,typ,ings.join(" ")+" fusion")) return "";
  const tiers = fuseTiers(name);
  const opened = openF[name] ? "open" : "";
  const allOn = VARIANTS.every(v => fuseHas(name,v));
  const fl = fuseHas(name,"Flawless");
  let html = `<details class="card drop ${tiers===7?"done":""} ${rarTheme(rar)}" ${opened} ontoggle="openF['${esc(name)}']=this.open"><i class="fill" style="width:${(tiers/7*100).toFixed(1)}%"></i><summary><div class="top" style="flex:1">${picWrap(name,"Fusion",rar)}<div class="grow"><div class="name">${name}</div><div class="meta">${typ} · ${tiers}/7 variants</div></div><label class="fl-pill ${fl?"on":""}" onclick="event.stopPropagation()"><input type="checkbox" ${fl?"checked":""} onchange="state.f['${esc(name)}|Flawless']=this.checked;save();render();">Flawless</label><label class="fl-pill ${allOn?"on":""}" onclick="event.stopPropagation()"><input type="checkbox" ${allOn?"checked":""} onchange="completeFusion('${esc(name)}')">Complete All</label><span class="badge Fusion">${rar}</span></div><span class="chev">▸</span></summary><div class="drop-body">`;
  VARIANTS.forEach(v => {
    const own = fuseHas(name,v);
    const got = ings.map((_,i)=>fuseIng(name,v,i));
    const ready = got.every(Boolean) && !own;
    const have = got.filter(Boolean).length;
    const vopen = openV[name+"|"+v] ? "open" : "";
    html += `<details class="tier ${vTheme(v)}" ${vopen} ontoggle="openV['${esc(name)}|${v}']=this.open"><summary><label class="chk ${own?"on":""}" style="background:transparent;border:0;padding:0;min-height:0;flex-direction:row;text-transform:none" onclick="event.stopPropagation()"><input type="checkbox" ${own?"checked":""} onchange="toggleFusionVariant('${esc(name)}','${v}',this.checked)"></label><span>${vName(v)}</span><span style="color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none">${have}/${ings.length}</span>${ready?'<span class="ready" style="margin:0">READY</span>':''}${own?'<span style="color:var(--green);font-size:10px">OWNED</span>':''}<span class="chev">▸</span></summary><div class="ings">`;
    ings.forEach((ing,i) => {
      const on = got[i];
      html += `<label class="chk ${on?"on":""} ${vTheme(v)}"><input type="checkbox" ${on?"checked":""} onchange="toggleFusionIng('${esc(name)}','${v}',${i},'${esc(ing)}',this.checked)">${vName(v).toUpperCase()} ${ing.toUpperCase()}</label>`;
    });
    html += `</div></details>`;
  });
  html += `</div></details>`;
  return html;
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  const qLive = norm(document.getElementById("q").value);
  if (qLive) {
    html += `<div class="hint">Matches for “${document.getElementById("q").value.trim()}”. Results update as you type. Tap the box again to start a new search.</div>`;
    let shown=0;
    const dHits = DROIDS.filter(([n,t,r]) => showCard(n,t,r));
    const fHits = FUSIONS.filter(([n,r,t,ings]) => showCard(n,t,ings.join(" ")));
    const iHits = ICONICS.filter(([n,t,ev,how]) => showCard(n,t,ev+" "+how));
    if (dHits.length){
      html += `<div class="rarity-h">Droidex</div>`;
      dHits.forEach(([n,t,r]) => { html += renderDroidCard(n,t,r,false); shown++; });
    }
    if (fHits.length){
      html += `<div class="rarity-h Fusion">Fusion</div>`;
      fHits.forEach(([n,r,t,ings]) => { html += renderFusionCard(n,r,t,ings,false); shown++; });
    }
    if (iHits.length){
      html += `<div class="rarity-h Iconic">Iconic</div>`;
      iHits.forEach(([n,t,ev,how]) => {
        html += `<article class="card"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div></article>`;
        shown++;
      });
    }
    if (!shown) html += `<div class="empty">No droids match “${document.getElementById("q").value.trim()}”.</div>`;
    app.innerHTML = html;
    updateStats();
    updateSaveLabel();
    return;
  }
  if (tab==="droidex") {
    let last="", shown=0;
    DROIDS.forEach(([n,t,r]) => {
      if (droidDone(n) || !showCard(n,t,r)) return;
      if (r!==last) { if (last) html += `</div>`; html += `<div class="rarity-h ${r}">${r}</div><div class="grid">`; last=r; }
      html += renderDroidCard(n,t,r,true); shown++;
    });
    if (last) html += `</div>`;
    if (!shown) html += `<div class="empty">Nothing left here. Check Done, or clear search.</div>`;
  }
  if (tab==="fusion") {
    html += `<div class="hint">17 fusion-only names. Each variant needs the <b>same-tier ingredients</b>. Example: Gold N-UL wants Gold B1 Heavy + Gold Gunrunner + Gold BB. Check the three parts, then check the result. 7/7 moves to Done.</div>`;
    let last="", shown=0;
    FUSIONS.forEach(([n,r,t,ings]) => {
      if (fuseDone(n) || !showCard(n,t,ings.join(" "))) return;
      if (r!==last) { html += `<div class="rarity-h ${r}">${r} fusion</div>`; last=r; }
      html += renderFusionCard(n,r,t,ings,true); shown++;
    });
    if (!shown) html += `<div class="empty">All fusion droids are complete, or none match the filter.</div>`;
  }
  if (tab==="srb") {
    const cyc = CYCLES[srbCycle] || CYCLES[1];
    html += `<div class="hint">Tap a rebirth to see the droids it wants. Super Rebirth unlocks at <b>Rebirth 12</b> plus one Rainbow Legendary. Cash-out walks Cycle 1→2→3→4→1.</div>`;
    html += `<div class="cycles">`;
    [1,2,3,4].forEach(n => {
      html += `<button class="${srbCycle===n?"on":""}" onclick="srbCycle=${n};state.rb.cycle=${n};save();render();">Cycle ${n}</button>`;
    });
    html += `</div>`;
    const qq = document.getElementById("q").value.trim().toLowerCase();
    const groups = [
      {id:"early", title:"Rebirths 1–11", from:1, to:11},
      {id:"srb", title:"Super Rebirth 12–35", from:12, to:35}
    ];
    groups.forEach(g => {
      const slice = [];
      for (let rb=g.from; rb<=g.to; rb++){
        const need = cyc[rb-1];
        if (!need) continue;
        const blob = "rebirth "+rb+" "+need.map(x=>x.join(" ")).join(" ")+" "+(CREDITS[rb-1]||"");
        if (qq && !blob.toLowerCase().includes(qq)) continue;
        slice.push(rb);
      }
      if (!slice.length) return;
      const cleared = slice.filter(rb => state.rb["c"+srbCycle+"r"+rb]).length;
      const gopen = openG[g.id+"-"+srbCycle] ? "open" : (qq ? "open" : "");
      html += `<details class="card drop" ${gopen} ontoggle="openG['${g.id}-${srbCycle}']=this.open"><i class="fill" style="width:${(slice.length?cleared/slice.length*100:0).toFixed(1)}%;background:linear-gradient(90deg,#9a3412,#fb923c 70%,#fed7aa)"></i><summary><div class="grow"><div class="name">${g.title}</div><div class="meta">${cleared}/${slice.length} cleared · Cycle ${srbCycle}</div></div><span class="chev">▸</span></summary><div class="drop-body">`;
      slice.forEach(rb => {
        const need = cyc[rb-1];
        const key = "c"+srbCycle+"r"+rb;
        const done = !!state.rb[key];
        const have = need.filter(([n,t]) => meets(n,t)).length;
        const ready = have===need.length;
        const nova = NOVA[rb] ? ` · ${NOVA[rb]} Nova` : "";
        const ropen = openR[key] ? "open" : "";
        html += `<details class="tier ${done?"done":""}" ${ropen} ontoggle="openR['${key}']=this.open"><i class="fill" style="width:${done?100:(need.length?have/need.length*100:0)}%"></i><summary><label class="fl-pill ${done?"on":""}" onclick="event.stopPropagation()"><input type="checkbox" ${done?"checked":""} onchange="toggleRebirth('${key}',this.checked)"></label><span>Rebirth ${rb}</span><span style="color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none">${have}/${need.length}</span><span class="rb-cost">${CREDITS[rb-1]||""}${nova}</span>${ready&&!done?'<span class="ready" style="margin:0">READY</span>':''}${done?'<span style="color:var(--green);font-size:10px">DONE</span>':''}${rb>=12?'<span class="srb">SRB</span>':''}<span class="chev">▸</span></summary><div class="ings">`;
        need.forEach(([n,t]) => {
          const ok = meets(n,t);
          html += `<label class="chk ${ok?"on":""} ${vTheme(t)}">${ok?"✓":"○"} ${vName(t).toUpperCase()} ${n.toUpperCase()}</label>`;
        });
        html += `</div></details>`;
      });
      html += `</div></details>`;
    });
  }
  if (tab==="more") {
    html += `<div class="hint">Iconics and workshop paint.</div><div class="rarity-h Iconic">Iconics</div>`;
    ICONICS.forEach(([n,t,ev,how]) => {
      if (iconDone(n) || !showCard(n,t,ev+" "+how)) return;
      const base = !!state.i[n+"|base"];
      html += `<article class="card"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars">
        <label class="chk"><input type="checkbox" onchange="state.i['${esc(n)}']=!state.i['${esc(n)}'];save();render();">Owned</label>
        <label class="chk ${base?"on":""}"><input type="checkbox" ${base?"checked":""} onchange="state.i['${esc(n)}|base']=!state.i['${esc(n)}|base'];save();render();">In base</label>
      </div></article>`;
    });
    html += `<div class="rarity-h">Paint</div>`;
    COSMETICS.forEach(([cat,item,how,cost],idx) => {
      if (!showCard(item,cat,how+" "+cost)) return;
      const on = !!state.c[idx];
      html += `<article class="card ${on?"done":""}"><div class="top"><div class="grow"><div class="name">${item}</div><div class="meta">${cat} · ${cost}</div></div></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars"><label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="state.c[${idx}]=!state.c[${idx}];save();render();">Have it</label></div></article>`;
    });
  }
  if (tab==="iconics") {
    html += `<div class="hint">Event-only named droids. Owned iconics move to Done.</div>`;
    let shown=0;
    ICONICS.forEach(([n,t,ev,how]) => {
      if (iconDone(n) || !showCard(n,t,ev+" "+how)) return;
      const base = !!state.i[n+"|base"];
      html += `<article class="card"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars">
        <label class="chk"><input type="checkbox" onchange="state.i['${esc(n)}']=!state.i['${esc(n)}'];save();render();">Owned</label>
        <label class="chk ${base?"on":""}"><input type="checkbox" ${base?"checked":""} onchange="state.i['${esc(n)}|base']=!state.i['${esc(n)}|base'];save();render();">In base</label>
      </div></article>`;
      shown++;
    });
    if (!shown) html += `<div class="empty">All iconics owned, or none match the filter.</div>`;
  }
  if (tab==="saves") {
    html += savePanel();
  }
  if (tab==="done") {
    html += `<div class="hint">Finished names only. Profiles and file load live on the <b>Profiles</b> tab. Super Rebirth is here.</div>`;
    html += `<div class="card" style="border-color:#7f1d3a"><div class="name">Super Rebirth</div><div class="meta" style="margin:6px 0 10px">Clears all droid / fusion / iconic / rebirth checks on this save. Keeps a backup so you can reload where you were. Fashion paints stay. Cycle advances ${srbCycle} → ${(srbCycle%4)+1}.</div><div class="act"><button class="danger" onclick="askSuperRebirth()">Super Rebirth</button></div></div>`;
    let shown=0;
    const doneD = DROIDS.filter(([n])=>droidDone(n));
    const doneF = FUSIONS.filter(([n])=>fuseDone(n));
    const doneI = ICONICS.filter(([n])=>iconDone(n));
    if (doneD.length){ html += `<div class="rarity-h">Regular</div>`; doneD.forEach(([n,t,r]) => { html += renderDroidCard(n,t,r,false); shown++; }); }
    if (doneF.length){ html += `<div class="rarity-h Fusion">Fusion</div>`; doneF.forEach(([n,r,t,ings]) => { html += renderFusionCard(n,r,t,ings,false); shown++; }); }
    if (doneI.length){
      html += `<div class="rarity-h Iconic">Iconic</div>`;
      doneI.forEach(([n,t,ev,how]) => {
        if (!showCard(n,t,ev)) return;
        html += `<article class="card done"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="vars"><label class="chk on"><input type="checkbox" checked onchange="state.i['${esc(n)}']=false;save();render();">Owned</label></div></article>`;
        shown++;
      });
    }
    if (!shown) html += `<div class="empty">Nothing completed yet. Finish all 7 variants on a droid, or own an iconic.</div>`;
  }
  if (tab==="alarms") {
    html += `<div class="hint">Keep this page open for alerts. Each drop has its own timer. Pick how many minutes early to warn, then Vibrate, Sound, or Both. iPhone cannot vibrate from a webpage — use Sound there.</div>`;
    [["Galactic","Every :15 and :45"],["Mythic","Hourly at :55"],["Stellar","Hourly at :00"]].forEach(([name,when]) => {
      const a = alarms[name];
      const at = name==="Galactic" ? nextGalactic() : nextHourly(name==="Mythic"?55:0);
      const theme = name==="Galactic"?"theme-gal":name==="Mythic"?"theme-myth":"theme-stel";
      html += `<article class="card ${theme}"><div class="name">${name}</div><div class="meta">${when} · next ${fmtLeft(at-Date.now())}</div>`;
      html += `<div class="vars" style="grid-template-columns:1fr;margin-top:10px"><label class="chk ${a.on?"on":""}" style="flex-direction:row;text-transform:none;letter-spacing:0"><input type="checkbox" ${a.on?"checked":""} onchange="setAlarm('${name}','on',this.checked)">Alarm on</label></div>`;
      html += `<div class="meta" style="margin:10px 0 6px">Warn this many minutes before</div><div class="vars">`;
      [1,2,3,4,5].forEach(n => {
        html += `<label class="chk ${a.lead===n?"on":""}"><input type="radio" name="lead-${name}" ${a.lead===n?"checked":""} onchange="setAlarm('${name}','lead',${n})">${n}m</label>`;
      });
      html += `</div><div class="meta" style="margin:10px 0 6px">Alert type</div><div class="vars">`;
      [["vibrate","Vibrate"],["sound","Sound"],["both","Both"]].forEach(([k,lab]) => {
        html += `<label class="chk ${a.mode===k?"on":""}" style="text-transform:none;letter-spacing:0"><input type="radio" name="mode-${name}" ${a.mode===k?"checked":""} onchange="setAlarm('${name}','mode','${k}')">${lab}</label>`;
      });
      html += `</div><div class="meta" style="margin:10px 0 6px">Alarm sound</div><div class="vars">`;
      SOUNDS.forEach(s => {
        html += `<label class="chk ${a.tone===s.id?"on":""}" style="text-transform:none;letter-spacing:0;font-size:10px"><input type="radio" name="tone-${name}" ${a.tone===s.id?"checked":""} onchange="setAlarm('${name}','tone','${s.id}')">${s.label}</label>`;
      });
      html += `</div><div class="act" style="margin-top:10px"><button onclick="testAlarm('${name}')">Test ${name}</button></div></article>`;
    });
  }
  if (tab==="cosmetics") {
    html += `<div class="hint">Workshop paints. These are not Droidex entries.</div>`;
    COSMETICS.forEach(([cat,item,how,cost],idx) => {
      if (!showCard(item,cat,how+" "+cost)) return;
      const on = !!state.c[idx];
      html += `<article class="card ${on?"done":""}"><div class="top"><div class="grow"><div class="name">${item}</div><div class="meta">${cat} · ${cost}</div></div></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars"><label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="state.c[${idx}]=!state.c[${idx}];save();render();">Have it</label></div></article>`;
    });
  }
  app.innerHTML = html;
  updateStats();
  updateSaveLabel();
}

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    tab = btn.dataset.tab;
    render();
    window.scrollTo(0,0);
  };
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("q").addEventListener("focus", e => {
  e.target.value = "";
  render();
});
document.getElementById("filter").addEventListener("change", render);
document.getElementById("loadFile").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (file) importSave(file);
});
document.getElementById("modal").addEventListener("click", e => { if (e.target.id==="modal") closeModal(); });
const ALARM_KEY = "droidex-alarms";
const SOUNDS = [
  {id:"r2",label:"R2 chirp"},
  {id:"probe",label:"Probe scan"},
  {id:"blaster",label:"Blaster"},
  {id:"binary",label:"Droid speak"},
  {id:"holocron",label:"Holocron"}
];
function defaultAlarms(){
  return {
    Galactic:{on:false,lead:1,mode:"both",tone:"r2"},
    Mythic:{on:false,lead:1,mode:"both",tone:"blaster"},
    Stellar:{on:false,lead:1,mode:"both",tone:"holocron"}
  };
}
let alarms = JSON.parse(localStorage.getItem(ALARM_KEY) || "{}");
["Galactic","Mythic","Stellar"].forEach(k => { alarms[k] = Object.assign(defaultAlarms()[k], alarms[k]||{}); });
const lastFired = {Galactic:0,Mythic:0,Stellar:0};
let audioCtx = null;
function saveAlarms(){ localStorage.setItem(ALARM_KEY, JSON.stringify(alarms)); }
function setAlarm(name, field, value){
  unlockAudio();
  alarms[name][field] = value;
  saveAlarms();
  if (field==="tone") playAlarmSound(value);
  render();
}
function unlockAudio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
function tone(type, freq, start, dur, peak){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  if (typeof freq === "number") o.frequency.setValueAtTime(freq, start);
  else freq(o.frequency, start);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(peak||0.2, start+0.02);
  g.gain.linearRampToValueAtTime(0, start+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(start); o.stop(start+dur+0.02);
}
function playAlarmSound(kind){
  unlockAudio();
  if (!audioCtx) return;
  const t0 = Math.max(audioCtx.currentTime, 0) + 0.03;
  let k = kind || "r2";
  if (k==="beep"||k==="chirp") k="r2";
  if (k==="siren") k="probe";
  if (k==="pulse") k="blaster";
  if (k==="chime") k="holocron";
  if (k==="r2"){
    const tweets = [[0,920,1480,0.09],[0.11,1600,780,0.1],[0.24,700,1900,0.12],[0.4,1200,900,0.08],[0.52,1800,2400,0.14],[0.7,640,1100,0.1]];
    tweets.forEach(([off,a,b,dur]) => tone("sine", (f,s)=>{ f.setValueAtTime(a,s); f.linearRampToValueAtTime(b,s+dur); }, t0+off, dur, 0.2));
  } else if (k==="probe"){
    [0,0.42,0.84,1.26].forEach((off,i) => {
      tone("triangle", i%2?1480:420, t0+off, 0.38, 0.16);
      tone("sine", i%2?740:210, t0+off, 0.38, 0.08);
    });
  } else if (k==="blaster"){
    [0,0.22,0.44].forEach(off => {
      tone("sawtooth", (f,s)=>{ f.setValueAtTime(980,s); f.linearRampToValueAtTime(140,s+0.16); }, t0+off, 0.16, 0.2);
      tone("square", (f,s)=>{ f.setValueAtTime(420,s); f.linearRampToValueAtTime(90,s+0.12); }, t0+off, 0.12, 0.08);
    });
  } else if (k==="binary"){
    const bits = [0,0.07,0.14,0.28,0.35,0.42,0.56,0.63,0.78,0.85,0.92];
    bits.forEach((off,i) => tone("square", i%3===0?310:i%2?880:1240, t0+off, 0.05, 0.16));
  } else {
    tone("sine", 523, t0, 0.55, 0.16);
    tone("sine", 784, t0+0.12, 0.6, 0.14);
    tone("sine", 1046, t0+0.28, 0.75, 0.12);
    tone("triangle", 392, t0, 0.8, 0.06);
  }
}
function buzz(){
  try { if (navigator.vibrate) navigator.vibrate([180,70,180,70,320,90,420]); } catch(e){}
}
function flashAlert(name){
  const el = document.getElementById("alarmToast");
  if (!el) return;
  el.className = "show " + (name==="Galactic"?"theme-gal":name==="Mythic"?"theme-myth":"theme-stel");
  el.textContent = name.toUpperCase() + " drop warning";
  el.style.display = "block";
  clearTimeout(flashAlert._t);
  flashAlert._t = setTimeout(() => { el.style.display="none"; el.className=""; }, 2500);
  try {
    if (window.Notification && Notification.permission==="granted") {
      new Notification(name+" belt drop", { body:"Timer warning", silent:false });
    }
  } catch(e){}
}
function runAlarm(name, force){
  const a = alarms[name] || {mode:"both"};
  const mode = force ? "both" : a.mode;
  if (mode !== "sound") buzz();
  if (mode !== "vibrate") playAlarmSound(a.tone || "beep");
  flashAlert(name);
}
function fireAlarm(name){
  const a = alarms[name];
  if (!a || !a.on) return;
  runAlarm(name, false);
}
function testAlarm(name){
  try {
    unlockAudio();
    if (window.Notification && Notification.permission==="default") Notification.requestPermission();
    const go = () => runAlarm(name, true);
    if (audioCtx && audioCtx.state==="suspended") audioCtx.resume().then(go).catch(go);
    else go();
  } catch(e) { flashAlert(name); }
}
function beltTarget(name){
  if (name==="Galactic") return nextGalactic();
  if (name==="Mythic") return nextHourly(55);
  return nextHourly(0);
}
function checkAlarms(){
  const now = Date.now();
  ["Galactic","Mythic","Stellar"].forEach(name => {
    const a = alarms[name];
    if (!a || !a.on) return;
    const at = beltTarget(name);
    const left = at - now;
    const leadMs = a.lead * 60 * 1000;
    if (left <= leadMs && left > leadMs - 2500) {
      const id = at.getTime();
      if (lastFired[name] !== id) {
        lastFired[name] = id;
        fireAlarm(name);
      }
    }
  });
}
function nextHourly(minMark){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), minMark, 0, 0);
  if (t <= now) t.setHours(t.getHours()+1);
  return t;
}
function nextGalactic(){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);
  const m = now.getMinutes() + now.getSeconds()/60;
  if (m < 15) t.setMinutes(15);
  else if (m < 45) t.setMinutes(45);
  else { t.setHours(t.getHours()+1); t.setMinutes(15); }
  return t;
}
function fmtLeft(ms){
  if (ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  const mm = Math.floor(s/60);
  const ss = String(s%60).padStart(2,"0");
  return mm+":"+ss;
}
function tickBelts(){
  const now = Date.now();
  const rows = [
    ["beltGal", nextGalactic()],
    ["beltMyth", nextHourly(55)],
    ["beltStel", nextHourly(0)]
  ];
  rows.forEach(([id, at]) => {
    const el = document.getElementById(id);
    if (!el) return;
    const left = at - now;
    el.classList.toggle("soon", left <= 60000);
    el.querySelector("b").textContent = fmtLeft(left);
  });
  checkAlarms();
}
tickBelts();
setInterval(tickBelts, 1000);
(function spaceBG(){
  const c = document.getElementById("space");
  if (!c || !c.getContext) return;
  const ctx = c.getContext("2d");
  let stars = [];
  function fit(){
    c.width = innerWidth;
    c.height = innerHeight;
    const n = Math.min(220, Math.floor(c.width*c.height/9000));
    stars = Array.from({length:n}, () => ({
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      z: 0.3 + Math.random()*1.7,
      p: Math.random()*Math.PI*2,
      s: 0.4 + Math.random()*1.4
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(st => {
      const tw = 0.45 + 0.55*Math.abs(Math.sin(t*0.001*st.z + st.p));
      ctx.fillStyle = `rgba(230,240,255,${0.25+0.55*tw})`;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.s*tw, 0, Math.PI*2);
      ctx.fill();
      st.y += 0.015*st.z;
      if (st.y > c.height+2) { st.y = -2; st.x = Math.random()*c.width; }
    });
    requestAnimationFrame(draw);
  }
  addEventListener("resize", fit, {passive:true});
  fit();
  requestAnimationFrame(draw);
})();
render();
</script>
