<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pocket Droid Tycoon Companion" />
<link rel="manifest" href="manifest.json" />
<title>Pocket Droid Tycoon Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0b0818; --bg2:#16122a; --card:#15122b; --line:#2b2550;
    --ink:#ece8ff; --muted:#8b85b3; --gold:#c4b5fd; --gold2:#ddd6fe;
    --green:#4ade80; --green-bg:rgba(74,222,128,.12);
    --common:#a78bfa; --rare:#60a5fa; --epic:#c084fc;
    --legendary:#fbbf24; --mythic:#fecaca; --iconic:#f472b6; --fusion:#2dd4bf;
    --gal:#e879f9; --gal-hi:#f5d0fe; --gal-line:#c026d3; --gal-bg:#120218;
    --myth-hi:#fecaca; --myth-line:#7f1d1d; --myth-bg:#16080a;
    --stel:#fbbf24; --stel-hi:#fef3c7; --stel-line:#f59e0b; --stel-bg:#0a0804;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#05030c; color:var(--ink); font-family:"Exo 2",sans-serif; }
  html { height:100dvh; }
  body { height:100dvh; overflow:hidden; display:flex; flex-direction:column; }
  #space { position:fixed; inset:0; z-index:0; width:100%; height:100%; pointer-events:none; }
  .nebula {
    position:fixed; z-index:0; pointer-events:none; filter:blur(40px); opacity:.45;
    animation:drift 80s ease-in-out infinite alternate;
  }
  .nebula.a { width:55vw; height:40vw; left:-8vw; top:8vh; background:radial-gradient(circle, #3b0764 0%, transparent 70%); }
  .nebula.b { width:48vw; height:36vw; right:-10vw; top:28vh; background:radial-gradient(circle, #083344 0%, transparent 70%); animation-duration:110s; }
  .nebula.c { width:40vw; height:30vw; left:20vw; bottom:-8vh; background:radial-gradient(circle, #4a044e 0%, transparent 72%); animation-duration:95s; }
  .planet {
    position:fixed; z-index:0; pointer-events:none; border-radius:50%;
    box-shadow:inset -6px -4px 12px rgba(0,0,0,.55), 0 0 18px rgba(255,255,255,.08);
    animation:orbit 120s linear infinite;
  }
  .planet.p1 { width:22px; height:22px; right:12vw; top:18vh; background:radial-gradient(circle at 35% 30%, #fde68a, #b45309 60%, #1c0a06); animation-duration:160s; }
  .planet.p2 { width:14px; height:14px; left:8vw; top:42vh; background:radial-gradient(circle at 30% 30%, #93c5fd, #1d4ed8 62%, #0b1220); animation-duration:210s; }
  .planet.p3 { width:9px; height:9px; right:22vw; bottom:16vh; background:radial-gradient(circle at 40% 30%, #fda4af, #9f1239 70%, #1c0a0e); animation-duration:180s; }
  @keyframes drift { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(6vw,-4vh,0) scale(1.08); } }
  @keyframes orbit { from { transform:translate3d(0,0,0); } to { transform:translate3d(-3vw,2vh,0); } }
  header { flex:none; z-index:20; background:linear-gradient(180deg,rgba(5,3,12,.96) 60%,rgba(5,3,12,.92)); border-bottom:1px solid var(--line); padding:calc(6px + env(safe-area-inset-top,0px)) 10px 8px; backdrop-filter:blur(8px); }
  main { position:relative; z-index:1; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:12px 12px calc(16px + var(--safe)); }
  body[data-tab="decks"] .toolbar,
  body[data-tab="alarms"] .toolbar,
  body[data-tab="saves"] .toolbar,
  body[data-tab="srb"] .toolbar { display:none; }
  h1 { margin:0; font-size:0; line-height:0; }
  h1.show { font-size:22px; line-height:1.1; text-align:center; font-family:Orbitron,sans-serif; letter-spacing:.12em; text-transform:uppercase; color:#f5d0fe; }
  .brand { display:block; width:min(360px,86vw); max-height:64px; object-fit:cover; object-position:center; height:auto; margin:0 auto 2px; border-radius:10px; }
  .dash { margin:0 0 6px; border:1px solid var(--line); border-radius:14px; background:rgba(12,10,24,.55); }
  .dash > summary { list-style:none; cursor:pointer; padding:8px 10px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-family:Orbitron,sans-serif; }
  .dash > summary::-webkit-details-marker { display:none; }
  .dash[open] > summary { color:var(--gold2); }
  .dash .dash-body { padding:0 8px 8px; }
  .sub { color:var(--muted); font-size:11px; margin-top:2px; text-align:center; font-family:Orbitron,sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  .belts { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px; }
  .belt { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 6px; text-align:center; }
  .belt b { display:block; font-size:16px; font-variant-numeric:tabular-nums; color:var(--gold2); font-family:Orbitron,sans-serif; letter-spacing:.08em; }
  .belt span { font-size:9px; color:var(--muted); letter-spacing:.18em; text-transform:uppercase; font-family:Orbitron,sans-serif; }
  .belt.soon { box-shadow:0 0 14px rgba(255,255,255,.12); }
  .belt.gal { background:radial-gradient(circle at 50% 0%, #4a0a63, #120218 70%); border-color:#d946ef; }
  .belt.gal b { color:#f5d0fe; text-shadow:0 0 10px #e879f9; }
  .belt.gal span { color:#e879f9; }
  .belt.myth { background:var(--myth-bg); border-color:var(--myth-line); }
  .belt.myth b { color:var(--myth-hi); }
  .belt.myth span { color:#f87171; }
  .belt.stel { background:radial-gradient(circle at 50% 120%, #7c4a08, #0a0804 62%); border-color:#f59e0b; }
  .belt.stel b { color:#fef3c7; text-shadow:0 0 10px #fbbf24; }
  .belt.stel span { color:#fbbf24; }
  .chk.v-def { color:#9ca3af; background:#141416; border-color:#4b5563; }
  .chk.v-def.on { color:#d1d5db; background:#1f2933; border-color:#6b7280; }
  .chk.v-gld { color:#facc15; background:linear-gradient(180deg,#3a2a08,#0c0a06); border-color:#ca8a04; }
  .chk.v-gld.on { color:#fef08a; background:linear-gradient(180deg,#5a430c,#161008); border-color:#facc15; box-shadow:0 0 10px rgba(250,204,21,.28); }
  .chk.v-dia {
    color:#a5f3fc; border-color:#22d3ee;
    background:
      radial-gradient(circle at 50% 0%, rgba(34,211,238,.28), transparent 55%),
      radial-gradient(circle at 18% 22%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 78% 30%, #67e8f9 0 1px, transparent 2px),
      #030712;
  }
  .chk.v-dia.on {
    color:#ecfeff; border-color:#67e8f9;
    box-shadow:0 0 12px rgba(34,211,238,.4);
    background:
      radial-gradient(circle at 50% 0%, rgba(103,232,249,.4), transparent 60%),
      radial-gradient(circle at 22% 18%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 70% 40%, #a5f3fc 0 1px, transparent 2px),
      #04131c;
  }
  .chk.v-rbw {
    color:#fff;
    border-color:#a3e635;
    background:
      linear-gradient(135deg, rgba(163,230,53,.55), rgba(34,211,238,.45) 35%, rgba(168,85,247,.5) 65%, rgba(244,114,182,.5));
  }
  .chk.v-rbw.on {
    color:#fff;
    border-color:#f0abfc;
    box-shadow:0 0 12px rgba(168,85,247,.35);
    background:
      linear-gradient(135deg, #a3e635, #22d3ee 30%, #a855f7 62%, #f472b6);
  }
  .chk.v-bsk { color:#e8b896; background:linear-gradient(180deg,#3f2a1e,#1c1410); border-color:#9a6b4a; }
  .chk.v-bsk.on { color:#f5e6d3; background:linear-gradient(180deg,#5a3b28,#241810); border-color:#d6a07a; box-shadow:0 0 8px rgba(214,160,122,.28); }
  .chk.v-gal { color:#f0abfc; background:radial-gradient(circle at 30% 0%, #3b0764, #120218 72%); border-color:#c026d3; }
  .chk.v-gal.on { color:#fce7ff; background:radial-gradient(circle at 30% 0%, #6b21a8, #1a0424 75%); border-color:#e879f9; box-shadow:0 0 10px rgba(232,121,249,.35); }
  .chk.v-stel { color:#fde047; background:radial-gradient(circle at 30% 0%, #7c4a08, #0a0804 72%); border-color:#d97706; }
  .chk.v-stel.on { color:#fffbeb; background:radial-gradient(circle at 30% 0%, #b45309, #120a04 75%); border-color:#fbbf24; box-shadow:0 0 10px rgba(251,191,36,.4); }
  .chk.v-myth { color:#f87171; background:var(--myth-bg); border-color:var(--myth-line); }
  .chk.v-myth.on { color:var(--myth-hi); background:rgba(239,68,68,.18); border-color:#ef4444; }
  details.tier.v-def { border-color:#4b5563; background:#141416; }
  details.tier.v-def > summary { color:#d1d5db; }
  details.tier.v-gld { border-color:#ca8a04; background:linear-gradient(180deg,#2a1e08,#0c0a06); }
  details.tier.v-gld > summary { color:#fde047; }
  details.tier.v-dia { border-color:#22d3ee; background:radial-gradient(circle at 12% 0%, #083344, #030712 70%); }
  details.tier.v-dia > summary { color:#a5f3fc; }
  details.tier.v-rbw { border-color:#a855f7; background:linear-gradient(135deg,#365314,#164e63 40%, #3b0764 75%, #4a044e); }
  details.tier.v-rbw > summary { color:#ecfccb; }
  details.tier.v-bsk { border-color:#9a6b4a; background:linear-gradient(180deg,#3f2a1e,#1c1410); }
  details.tier.v-bsk > summary { color:#f5e6d3; }
  details.tier.v-gal { border-color:#c026d3; background:radial-gradient(circle at 8% 0%, #3b0764, #120218 68%); }
  details.tier.v-gal > summary { color:#f5d0fe; }
  details.tier.v-stel { border-color:#d97706; background:radial-gradient(circle at 8% 0%, #7c4a08, #0a0804 68%); }
  details.tier.v-stel > summary { color:#fef3c7; }
  details.tier.v-myth { border-color:var(--myth-line); background:var(--myth-bg); }
  details.tier.v-myth > summary { color:var(--myth-hi); }
  .card.theme-gal { background:radial-gradient(circle at 12% 0%, #4a0a63, #120218 62%); border-color:#d946ef; }
  .card.theme-myth { background:linear-gradient(180deg,#2a0c10,#16080a); border-color:var(--myth-line); }
  .card.theme-stel { background:radial-gradient(circle at 12% 110%, #7c4a08, #0a0804 58%); border-color:#f59e0b; }
  .rarity-h.Mythic { color:var(--myth-hi); }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:10px; }
  @media (max-width:560px){ .stats { grid-template-columns:repeat(3,1fr); } }
  .stat { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:16px; padding:8px 4px; text-align:center; }
  .stat .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#3f6212,#84cc16 55%,#d9f99d); opacity:.42; pointer-events:none; transition:width .25s ease; }
  .stat b, .stat span { position:relative; z-index:1; }
  .stat b { display:block; font-size:15px; color:var(--gold2); font-family:Orbitron,sans-serif; letter-spacing:.06em; }
  .stat span { font-size:9px; color:var(--muted); font-family:Orbitron,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
  .toolbar { display:flex; gap:8px; margin-top:10px; }
  input[type="search"], select {
    flex:1; background:rgba(12,10,24,.78); color:var(--ink); border:1px solid var(--line);
    border-radius:16px; padding:10px 12px; font-size:13px; outline:none;
    font-family:Orbitron,sans-serif; letter-spacing:.06em;
  }
  .tabs { display:flex; flex-direction:column; gap:4px; margin-top:10px; }
  .tabrow { display:grid; gap:4px; }
  .tabrow.row1 { grid-template-columns:repeat(4,1fr); }
  .tabrow.row2 { grid-template-columns:repeat(3,1fr); }
  .tabs button { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:14px; color:var(--muted); padding:9px 2px; font-size:10px; font-weight:700; font-family:Orbitron,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  .tabs button .fill { position:absolute; left:0; top:0; bottom:0; width:0; opacity:.42; pointer-events:none; transition:width .25s ease; }
  .tabs button span { position:relative; z-index:1; }
  .tabs button.on { color:#fff; background:rgba(196,181,253,.12); border-color:#c4b5fd; }
  .tabs button[data-tab="droidex"] .fill { background:linear-gradient(90deg,#0e7490,#67e8f9); }
  .tabs button[data-tab="fusion"] .fill { background:linear-gradient(90deg,#0f766e,#2dd4bf); }
  .tabs button[data-tab="srb"] .fill { background:linear-gradient(90deg,#c2410c,#fb923c); }
  .tabs button[data-tab="done"] .fill { background:linear-gradient(90deg,#166534,#4ade80); }
  .tabs button[data-tab="iconics"] .fill { background:linear-gradient(90deg,#9d174d,#f472b6); }
  .tabs button[data-tab="cosmetics"] .fill { background:linear-gradient(90deg,#5b21b6,#c4b5fd); }
  .tabs button[data-tab="saves"] .fill { background:linear-gradient(90deg,#334155,#94a3b8); }
  .tabs button[data-tab="alarms"] .fill { background:linear-gradient(90deg,#a16207,#fbbf24); }
  .tabs button[data-tab="decks"] .fill { background:linear-gradient(90deg,#6d28d9,#c4b5fd); }
  .hint { background:rgba(12,10,24,.72); border:1px solid var(--line); border-radius:16px; padding:12px 14px; color:var(--muted); font-size:13px; line-height:1.45; margin-bottom:12px; }
  .rarity-h { position:sticky; top:0; z-index:10; margin:14px 0 8px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); background:rgba(5,3,12,.92); padding:6px 2px; font-family:Orbitron,sans-serif; }
  .deck-total { text-align:center; padding:16px 10px; border-color:#c4b5fd; background:radial-gradient(circle at 50% 0%, #2a1848, #0c0818 70%); }
  .deck-total b { display:block; font-size:22px; color:#f5d0fe; font-family:Orbitron,sans-serif; letter-spacing:.06em; }
  .deck-total span { color:var(--muted); font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-family:Orbitron,sans-serif; }
  .deck-slot { display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:center; }
  .deck-slot .slot-fields { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .deck-slot select, .deck-field {
    width:100%; background:#100d22; color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:8px; font-size:12px; font-family:Orbitron,sans-serif;
  }
  .floor {
    margin-top:10px; padding:10px;
    background:
      radial-gradient(circle at 12% 0%, rgba(196,181,253,.08), transparent 42%),
      repeating-linear-gradient(0deg, transparent 0 18px, rgba(196,181,253,.05) 18px 19px),
      repeating-linear-gradient(90deg, transparent 0 18px, rgba(196,181,253,.05) 18px 19px),
      rgba(8,6,18,.72);
    border:1px dashed rgba(196,181,253,.35);
    border-radius:18px;
  }
  .floor h3 { margin:0 0 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold2); font-family:Orbitron,sans-serif; }
  .floor.worker { border-color:rgba(74,222,128,.35); }
  .floor.astromech { border-color:rgba(96,165,250,.4); }
  .floor.battle { border-color:rgba(251,113,133,.4); }
  .floor.lounge { border-color:rgba(251,191,36,.4); }
  .floor.firing { border-color:rgba(248,113,113,.45); }
  .floor.companion { border-color:rgba(167,139,250,.45); }
  .floor.fuse { border-color:rgba(232,121,249,.45); }
  .pads { display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; justify-items:center; }
  .pad {
    width:58px; height:72px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    background:rgba(6,4,14,.7); border:2px dotted #5b5388; border-radius:14px; color:var(--muted);
  }
  .pad .pic { width:44px; height:44px; margin-top:4px; border-radius:10px; border-style:dotted; }
  .pad .pad-lab { font-size:8px; letter-spacing:.04em; text-transform:uppercase; font-family:Orbitron,sans-serif; max-width:54px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pad.empty .pic { background:transparent; border:2px dotted #3f3a63; display:flex; align-items:center; justify-content:center; color:#5b5388; font-size:16px; }
  .pad.filled { border-style:solid; border-color:#a78bfa; background:rgba(20,12,40,.85); }
  .pad.match { border-color:#4ade80; }
  .pad.offtype { border-color:#fbbf24; }
  .pad.lounge { border-color:#ca8a04; }
  .deck-bar { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; align-items:center; }
  .deck-bar button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:14px; padding:7px 10px; font-size:10px; font-weight:700; font-family:Orbitron,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .deck-bar button.on { color:#0b1220; background:var(--gold); border-color:var(--gold); }
  .xbtn { background:#3b1020; color:#fb7185; border:1px solid #7f1d3a; border-radius:12px; padding:8px 10px; font-size:11px; font-weight:800; }
  .pick-grid { display:grid; grid-template-columns:1fr; gap:10px; margin-top:8px; }
  @media (min-width:720px){ .pick-grid { grid-template-columns:1fr 1fr 1fr; } }
  .pick-col { background:rgba(8,6,18,.7); border:1px dashed rgba(196,181,253,.3); border-radius:14px; padding:8px; }
  .pick-col h3 { margin:0 0 6px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold2); font-family:Orbitron,sans-serif; }
  .pick-list { max-height:160px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .pick-item { text-align:left; background:#100d22; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:7px 8px; font-size:11px; font-family:Orbitron,sans-serif; letter-spacing:.04em; }
  .pick-item.on { border-color:#c4b5fd; background:rgba(196,181,253,.16); color:#f5d0fe; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:720px){ .grid { grid-template-columns:1fr 1fr; } }
  .card { position:relative; overflow:hidden; background:rgba(12,10,24,.78); border:1px solid var(--line); border-radius:16px; padding:12px; }
  .card > i.fill { position:absolute; left:0; top:0; height:76px; bottom:auto; width:0; background:linear-gradient(90deg,#365314,#84cc16 70%,#d9f99d); opacity:.28; pointer-events:none; }
  details.drop > i.fill { display:none; }
  details.drop > summary > i.fill {
    position:absolute; left:0; top:0; bottom:0; height:auto; width:0;
    background:linear-gradient(90deg,#365314,#84cc16 70%,#d9f99d);
    opacity:.38; pointer-events:none;
  }
  details.drop > summary { border-bottom:1px solid rgba(43,37,80,.85); }
  details.drop:not([open]) > summary { border-bottom:0; }
  .card.done { border-color:rgba(74,222,128,.35); }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:nowrap; min-width:0; }
  .pills { display:flex; flex-direction:column; gap:6px; flex:none; align-items:stretch; }
  .pills .fl-pill { justify-content:flex-start; min-width:128px; padding:7px 10px; }
  .pills .badge { text-align:center; }
  .pic { width:52px; height:52px; border-radius:10px; overflow:hidden; flex:none; background:#000; border:1px solid var(--line); position:relative; }
  .pic img, .pic svg { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .pic svg.glyph { position:absolute; inset:0; }
  .name { font-weight:800; font-size:13px; font-family:Orbitron,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  .meta { color:var(--muted); font-size:10px; margin-top:3px; font-family:Orbitron,sans-serif; letter-spacing:.1em; text-transform:uppercase; }
  .grow { flex:1; min-width:0; }
  .badge { font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:5px 8px; border-radius:12px; border:1px solid currentColor; white-space:nowrap; font-family:Orbitron,sans-serif; }
  .Common{color:var(--common)} .Rare{color:var(--rare)} .Epic{color:var(--epic)}
  .Legendary{color:var(--legendary)} .Mythic{color:var(--mythic)} .Iconic{color:var(--iconic)} .Fusion{color:var(--fusion)}
  .vars { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }

const KEY = "droidex-v2";
const SAVES_KEY = "droidex-saves";
function blankState(cycle){ return {d:{},f:{},i:{},c:{},rb:{cycle:cycle||1},decks:{active:0,list:[blankDeck("Deck 1")]}}; }
function blankDeck(name){ return {name:name||"Base",mult:1,bonus:true,slots:[]}; }
function allDeckNames(){
  return DROIDS.map(d=>d[0]).concat(FUSIONS.map(d=>d[0])).concat(ICONICS.map(d=>d[0]));
}
function isIconic(name){ return ICONICS.some(d => d[0]===name); }
function ownedOptions(){
  const names = [];
  DROIDS.forEach(([n]) => { if (ownedTiers(n)) names.push(n); });
  FUSIONS.forEach(([n]) => { if (fuseTiers(n)) names.push(n); });
  ICONICS.forEach(([n]) => { if (state.i && state.i[n]) names.push(n); });
  return names.length ? names : allDeckNames();
}
function collectionBonus(){
  let n = 0;
  DROIDS.forEach(([nm]) => { if (ownedTiers(nm)) n++; });
  FUSIONS.forEach(([nm]) => { if (fuseTiers(nm)) n++; });
  ICONICS.forEach(([nm]) => { if (state.i && state.i[nm]) n++; });
  return n;
}
const FLOORS = [
  {id:"worker", label:"Worker deck", kind:"Worker", count:11},
  {id:"astromech", label:"Astromech deck", kind:"Astromech", count:9},
  {id:"battle", label:"Battle deck", kind:"Battle", count:5},
  {id:"firing", label:"Firing range", kind:"Battle", count:6},
  {id:"lounge", label:"Lounge · storage only", kind:"Lounge", count:13},
  {id:"companion", label:"Companion · buff only", kind:"Companion", count:2, group:"base"},
  {id:"fuse1", label:"Fusion pads", kind:"Fusion", count:3, group:"fusion", lab:1},
  {id:"chamber1", label:"Chamber", kind:"Chamber", count:1, group:"fusion", lab:1},
  {id:"fuse2", label:"Fusion pads", kind:"Fusion", count:3, group:"fusion", lab:2},
  {id:"chamber2", label:"Chamber", kind:"Chamber", count:1, group:"fusion", lab:2}
];
const PAD_TAG = {worker:"W",astromech:"A",battle:"B",firing:"F",lounge:"L",companion:"C",fuse1:"1-",chamber1:"C1-",fuse2:"2-",chamber2:"C2-"};
const EARN_KINDS = {Worker:1,Astromech:1,Battle:1};
const PAD_TOTAL = FLOORS.reduce((a,f)=>a+f.count,0);
function padList(){
  const pads = [];
  FLOORS.forEach(f => {
    for (let i=0;i<f.count;i++) pads.push({id:f.id+i, kind:f.kind, floor:f.id, n:i+1});
  });
  return pads;
}
const PADS = padList();
function classOf(name){
  const d = DROIDS.find(x=>x[0]===name);
  if (d) return d[1];
  const f = FUSIONS.find(x=>x[0]===name);
  if (f) return f[2];
  const ic = ICONICS.find(x=>x[0]===name);
  if (ic) return ic[1];
  return "";
}
function normalizeDeck(deck){
  if (!deck.pads) deck.pads = {};
  if (Array.isArray(deck.slots) && deck.slots.length && !Object.keys(deck.pads).length){
    deck.slots.forEach((s,i) => {
      if (s && s.name && PADS[i]) deck.pads[PADS[i].id] = {name:s.name, variant:s.variant||"Basic", mult:s.mult||1};
    });
  }
  return deck;
}
function padSlot(deck, id){
  return (deck.pads && deck.pads[id]) || null;
}
function earnsIncome(kind){ return !!EARN_KINDS[kind]; }
function slotCps(slot, kind){
  if (!slot || !slot.name) return 0;
  if (!earnsIncome(kind)) return 0;
  if (isIconic(slot.name)) return 0;
  const raw = rateOf(slot.name, slot.variant||"Basic") * (Number(slot.mult)||1);
  const match = classOf(slot.name)===kind ? 1.1 : 1;
  return raw * match;
}
function iconicBoost(deck){
  let n = 0;
  PADS.forEach(p => {
    if (!earnsIncome(p.kind)) return;
    const s = padSlot(deck,p.id);
    if (s && s.name && isIconic(s.name)) n++;
  });
  return n;
}
function deckCps(deck){
  if (!deck) return 0;
  normalizeDeck(deck);
  const raw = PADS.reduce((a,p)=>a+slotCps(padSlot(deck,p.id), p.kind),0);
  const bonus = deck.bonus===false ? 1 : (1 + collectionBonus()/100);
  const icon = 1 + iconicBoost(deck)*0.15;
  return raw * (Number(deck.mult)||1) * bonus * icon;
}
function activeDeck(){
  ensureDecks(state);
  return normalizeDeck(state.decks.list[state.decks.active] || state.decks.list[0]);
}
function setDeckField(field, value){
  const d = activeDeck();
  if (field==="name") d.name = value;
  if (field==="mult") d.mult = Math.max(0, Number(value)||0);
  if (field==="bonus") d.bonus = !!value;
  save(); render();
}
function addDeck(){
  ensureDecks(state);
  state.decks.list.push(blankDeck("Base "+(state.decks.list.length+1)));
  state.decks.active = state.decks.list.length-1;
  save(); render();
}
function switchDeck(i){
  state.decks.active = Number(i)||0;
  save(); render();
}
function setPad(id, name, variant){
  const d = activeDeck();
  if (!d.pads) d.pads = {};
  if (!name) delete d.pads[id];
  else d.pads[id] = {name, variant: variant||"Basic", mult:1};
  save(); render();
}
function namesOfType(kind){
  return allDeckNames().filter(n => classOf(n)===kind);
}
function choosePadName(n){
  window._padPick = n || "";
  const hid = document.getElementById("padName");
  if (hid) hid.value = n || "";
  const lab = document.getElementById("padChosen");
  if (lab) lab.textContent = n ? ("Selected: "+n+(isIconic(n)?" · iconic +15%":" · "+classOf(n))) : "No droid selected";
  const kind = n ? classOf(n) : "";
  ["Worker","Astromech","Battle"].forEach(k => {
    const sel = document.getElementById("pick-"+k);
    if (sel) sel.value = (k===kind ? n : "");
  });
  const varBox = document.getElementById("padVarBox");
  if (varBox){
    if (n && isIconic(n)) varBox.innerHTML = `<input id="padVar" type="hidden" value="Basic"><div class="meta">Iconic · +15% income when parked</div>`;
    else {
      let html = `<div class="meta" style="margin:10px 0 6px">Variant</div><select id="padVar" class="deck-field">`;
      VARIANTS.forEach(v => { html += `<option value="${v}">${v}</option>`; });
      html += `</select>`;
      varBox.innerHTML = html;
    }
  }
}
function openPad(id){
  const deck = activeDeck();
  const pad = PADS.find(p=>p.id===id);
  const cur = padSlot(deck, id) || {};
  window._padPick = cur.name || "";
  const owned = new Set(ownedOptions());
  const box = document.getElementById("modal");
  box.classList.remove("hidden");
  let html = `<div class="sheet"><h2>${pad.kind} ${pad.n}</h2><p>Pick from one type list. Matching type gets +10%.</p>`;
  html += `<input id="padName" type="hidden" value="${esc(cur.name||"")}">`;
  html += `<div id="padChosen" class="meta">${cur.name?("Selected: "+cur.name):"No droid selected"}</div>`;
  ["Worker","Astromech","Battle"].forEach(kind => {
    html += `<div class="meta" style="margin:10px 0 6px">${kind}</div>`;
    html += `<select id="pick-${kind}" class="deck-field" onchange="choosePadName(this.value)">`;
    html += `<option value="">Empty</option>`;
    namesOfType(kind).forEach(n => {
      const sel = n===cur.name ? "selected" : "";
      html += `<option value="${esc(n)}" ${sel}>${owned.has(n)?"● ":""}${n}${isIconic(n)?" ★":""}</option>`;
    });
    html += `</select>`;
  });
  html += `<div id="padVarBox">`;
  if (cur.name && isIconic(cur.name)) html += `<input id="padVar" type="hidden" value="Basic"><div class="meta" style="margin-top:8px">Iconic · +15% income when parked</div>`;
  else {
    html += `<div class="meta" style="margin:10px 0 6px">Variant</div><select id="padVar" class="deck-field">`;
    VARIANTS.forEach(v => { html += `<option value="${v}" ${v===(cur.variant||"Basic")?"selected":""}>${v}</option>`; });
    html += `</select>`;
  }
  html += `</div><div class="row" style="margin-top:12px"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="setPad('${id}','','');closeModal()">Clear</button><button onclick="setPad('${id}',document.getElementById('padName').value,document.getElementById('padVar').value);closeModal()">Park</button></div></div>`;
  box.innerHTML = html;
}
function renderDecks(){
  const deck = activeDeck();
  const visiblePads = PADS.filter(p => {
    const f = FLOORS.find(x=>x.id===p.floor);
    return !f || f.group!=="fusion" || f.lab===1 || state.decks.secondLab;
  });
  let parked = 0;
  visiblePads.forEach(p => { if (padSlot(deck,p.id) && padSlot(deck,p.id).name) parked++; });
  const visTotal = visiblePads.length;
  let html = `<div class="hint">Hard caps: 11 worker · 9 astromech · 11 battle (5 + 6 firing range) · 13 lounge · 2 companion. Fusion lab is 3 pads + 1 chamber; a second tank (300 Nova / 1,800 V-Bucks) unlocks another 3+1. Lounge, companions, fusion, and chamber do not earn credits/s. Lounge + fusion/chamber still count for rebirths. Green = matching type +10%.</div>`;

function renderFusionCard(name,rar,typ,ings,hideDone){

  else freq(o.frequency, start);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(peak||0.2, start+0.02);
  g.gain.linearRampToValueAtTime(0, start+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(start); o.stop(start+dur+0.02);
}
function playAlarmSound(kind){
  unlockAudio();
  if (!audioCtx) return;
  const t0 = Math.max(audioCtx.currentTime, 0) + 0.03;
  let k = kind || "r2";
  if (k==="beep"||k==="chirp") k="r2";
  if (k==="siren") k="probe";
  if (k==="pulse") k="blaster";
  if (k==="chime") k="holocron";
  if (k==="r2"){
    const tweets = [[0,920,1480,0.09],[0.11,1600,780,0.1],[0.24,700,1900,0.12],[0.4,1200,900,0.08],[0.52,1800,2400,0.14],[0.7,640,1100,0.1]];
    tweets.forEach(([off,a,b,dur]) => tone("sine", (f,s)=>{ f.setValueAtTime(a,s); f.linearRampToValueAtTime(b,s+dur); }, t0+off, dur, 0.2));
  } else if (k==="probe"){
    [0,0.42,0.84,1.26].forEach((off,i) => {
      tone("triangle", i%2?1480:420, t0+off, 0.38, 0.16);
      tone("sine", i%2?740:210, t0+off, 0.38, 0.08);
    });
  } else if (k==="blaster"){
    [0,0.22,0.44].forEach(off => {
      tone("sawtooth", (f,s)=>{ f.setValueAtTime(980,s); f.linearRampToValueAtTime(140,s+0.16); }, t0+off, 0.16, 0.2);
      tone("square", (f,s)=>{ f.setValueAtTime(420,s); f.linearRampToValueAtTime(90,s+0.12); }, t0+off, 0.12, 0.08);
    });
  } else if (k==="binary"){
    const bits = [0,0.07,0.14,0.28,0.35,0.42,0.56,0.63,0.78,0.85,0.92];
    bits.forEach((off,i) => tone("square", i%3===0?310:i%2?880:1240, t0+off, 0.05, 0.16));
  } else {
    tone("sine", 523, t0, 0.55, 0.16);
    tone("sine", 784, t0+0.12, 0.6, 0.14);
    tone("sine", 1046, t0+0.28, 0.75, 0.12);
    tone("triangle", 392, t0, 0.8, 0.06);
  }
}
function buzz(){
  try { if (navigator.vibrate) navigator.vibrate([180,70,180,70,320,90,420]); } catch(e){}
}
function flashAlert(name){
  const el = document.getElementById("alarmToast");
  if (!el) return;
  el.className = "show " + (name==="Galactic"?"theme-gal":name==="Mythic"?"theme-myth":"theme-stel");
  el.textContent = name.toUpperCase() + " drop warning";
  el.style.display = "block";
  clearTimeout(flashAlert._t);
  flashAlert._t = setTimeout(() => { el.style.display="none"; el.className=""; }, 2500);
  try {
    if (window.Notification && Notification.permission==="granted") {
      new Notification(name+" belt drop", { body:"Timer warning", silent:false });
    }
  } catch(e){}
}
function runAlarm(name, force){
  const a = alarms[name] || {mode:"both"};
  const mode = force ? "both" : a.mode;
  if (mode !== "sound") buzz();
  if (mode !== "vibrate") playAlarmSound(a.tone || "beep");
  flashAlert(name);
}
function fireAlarm(name){
  const a = alarms[name];
  if (!a || !a.on) return;
  runAlarm(name, false);
}
function testAlarm(name){
  try {
    unlockAudio();
    if (window.Notification && Notification.permission==="default") Notification.requestPermission();
    const go = () => runAlarm(name, true);
    if (audioCtx && audioCtx.state==="suspended") audioCtx.resume().then(go).catch(go);
    else go();
  } catch(e) { flashAlert(name); }
}
function beltTarget(name){
  if (name==="Galactic") return nextGalactic();
  if (name==="Mythic") return nextHourly(55);
  return nextHourly(0);
}
function checkAlarms(){
  const now = Date.now();
  ["Galactic","Mythic","Stellar"].forEach(name => {
    const a = alarms[name];
    if (!a || !a.on) return;
    const at = beltTarget(name);
    const left = at - now;
    const leadMs = a.lead * 60 * 1000;
    if (left <= leadMs && left > leadMs - 2500) {
      const id = at.getTime();
      if (lastFired[name] !== id) {
        lastFired[name] = id;
        fireAlarm(name);
      }
    }
  });
}
function nextHourly(minMark){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), minMark, 0, 0);
  if (t <= now) t.setHours(t.getHours()+1);
  return t;
}
function nextGalactic(){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);
  const m = now.getMinutes() + now.getSeconds()/60;
  if (m < 15) t.setMinutes(15);
  else if (m < 45) t.setMinutes(45);
  else { t.setHours(t.getHours()+1); t.setMinutes(15); }
  return t;
}
function fmtLeft(ms){
  if (ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  const mm = Math.floor(s/60);
  const ss = String(s%60).padStart(2,"0");
  return mm+":"+ss;
}
function tickBelts(){
  const now = Date.now();
  const rows = [
    ["beltGal", nextGalactic()],
    ["beltMyth", nextHourly(55)],
    ["beltStel", nextHourly(0)]
  ];
  rows.forEach(([id, at]) => {
    const el = document.getElementById(id);
    if (!el) return;
    const left = at - now;
    el.classList.toggle("soon", left <= 60000);
    el.querySelector("b").textContent = fmtLeft(left);
  });
  checkAlarms();
}
tickBelts();
setInterval(tickBelts, 1000);
(function spaceBG(){
  const c = document.getElementById("space");
  if (!c || !c.getContext) return;
  const ctx = c.getContext("2d");
  let stars = [];
  function fit(){
    c.width = innerWidth;
    c.height = innerHeight;
    const n = Math.min(220, Math.floor(c.width*c.height/9000));
    stars = Array.from({length:n}, () => ({
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      z: 0.3 + Math.random()*1.7,
      p: Math.random()*Math.PI*2,
      s: 0.4 + Math.random()*1.4
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(st => {
      const tw = 0.45 + 0.55*Math.abs(Math.sin(t*0.001*st.z + st.p));
      ctx.fillStyle = `rgba(230,240,255,${0.25+0.55*tw})`;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.s*tw, 0, Math.PI*2);
      ctx.fill();
      st.y += 0.015*st.z;
      if (st.y > c.height+2) { st.y = -2; st.x = Math.random()*c.width; }
    });
    requestAnimationFrame(draw);
  }
  addEventListener("resize", fit, {passive:true});
  fit();
  requestAnimationFrame(draw);
})();
render();
</script>
