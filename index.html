<meta name="theme-color" content="#0b1220" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Droidex" />
<link rel="manifest" href="manifest.json" />
<title>Droidex Checklist · Droid Tycoon</title>
<style>
  :root {
    --bg:#0b0818; --bg2:#16122a; --card:#15122b; --line:#2b2550;

    --green:#4ade80; --green-bg:rgba(74,222,128,.12);
    --common:#a78bfa; --rare:#60a5fa; --epic:#c084fc;
    --legendary:#fbbf24; --mythic:#fb7185; --iconic:#f472b6; --fusion:#2dd4bf;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; }
  body { padding-bottom: calc(92px + var(--safe)); }
  header { position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#0b0818 72%,rgba(11,8,24,.92)); border-bottom:1px solid var(--line); padding:12px 14px 10px; }
  h1 { margin:0; font-size:18px; letter-spacing:.14em; color:#fff; }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 4px; text-align:center; }
  .stat b { display:block; font-size:15px; color:var(--gold2); }
  .stat span { font-size:10px; color:var(--muted); }
  .toolbar { display:flex; gap:8px; margin-top:10px; }
  input[type="search"], select {
    flex:1; background:var(--bg2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:14px; outline:none;
  }
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,1fr); background:#100d1f; border-top:1px solid var(--line); padding-bottom:var(--safe); }
  .tabs button { background:none; border:0; color:var(--muted); padding:11px 2px 9px; font-size:11px; font-weight:700; }
  .tabs button.on { color:var(--gold); }
  main { padding:12px; }
  .hint { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--muted); font-size:13px; line-height:1.45; margin-bottom:12px; }
  .rarity-h { position:sticky; top:148px; z-index:10; margin:14px 0 8px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); background:var(--bg); padding:6px 2px; }
  .grid { display:grid; grid-template-columns:1fr; gap:8px; }
  @media (min-width:720px){ .grid { grid-template-columns:1fr 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card.done { border-color:rgba(74,222,128,.35); }
  .top { display:flex; gap:8px; align-items:flex-start; }
  .pic { width:72px; height:72px; border-radius:10px; overflow:hidden; flex:none; background:#0a0714; border:1px solid var(--line); position:relative; }
  .pic img, .pic svg { width:100%; height:100%; display:block; object-fit:cover; object-position:center top; }
  .pic svg.glyph { position:absolute; inset:0; }
  .name { font-weight:800; font-size:15px; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .grow { flex:1; min-width:0; }
  .badge { font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:4px 7px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .Common{color:var(--common)} .Rare{color:var(--rare)} .Epic{color:var(--epic)}
  .Legendary{color:var(--legendary)} .Mythic{color:var(--mythic)} .Iconic{color:var(--iconic)} .Fusion{color:var(--fusion)}
  .vars { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px; }
  .chk { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:#100d22; border:1px solid var(--line); border-radius:8px; padding:7px 2px; min-height:44px; }
  .chk.on { color:var(--green); background:var(--green-bg); border-color:rgba(61,214,140,.4); }
  .chk input { accent-color:var(--green); width:15px; height:15px; }
  .tier { margin-top:10px; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:8px; }
  .tier h3 { margin:0 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold2); display:flex; justify-content:space-between; align-items:center; }
  .ings { display:flex; flex-direction:column; gap:5px; }
  .ings .chk { flex-direction:row; justify-content:flex-start; text-transform:none; letter-spacing:0; font-size:12px; min-height:0; padding:7px 8px; }
  .ready { margin-top:6px; font-size:11px; font-weight:800; color:var(--gold); }
  .empty { text-align:center; color:var(--muted); padding:36px 12px; }
  .cycles { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; }
  .cycles button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:7px 10px; font-size:11px; font-weight:700; }
  .cycles button.on { color:#0b1220; background:var(--gold); border-color:var(--gold); }
  .rb-row { display:flex; flex-direction:column; gap:6px; }
  .rb-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rb-cost { color:var(--gold2); font-size:12px; font-weight:700; }
  .srb { font-size:10px; color:var(--gold); font-weight:800; letter-spacing:.04em; }
</style>
</head>

    [["ID10","Basic"],["Pit","Basic"],["DRK-1 Probe","Basic"]],
    [["R3","Basic"],["2BB","Basic"],["Senate Hovercam","Basic"]],
    [["R5","Gold"],["R8","Gold"],["R4","Basic"]],
    [["B1 Battle","Gold"],["R9","Gold"],["B1 Security","Gold"]],
    [["R3","Gold"],["2BB","Gold"],["Senate Hovercam","Gold"]],
    [["R5","Diamond"],["R4","Diamond"],["BDX Explorer","Diamond"]],
    [["R8","Diamond"],["B1 Battle","Diamond"],["R9","Diamond"]],
    [["R3","Rainbow"],["B1 Security","Rainbow"],["2BB","Rainbow"]],
    [["R5","Rainbow"],["R4","Rainbow"],["BDX Explorer","Rainbow"]],
    [["Senate Hovercam","Rainbow"],["Groundmech","Basic"],["TRAK-R","Basic"]],
    [["B2 Heavy","Basic"],["B2 Super","Basic"],["Util-Tec","Basic"]],

    [["B2 Super","Rainbow"],["Mecha-Droid","Basic"],["Proto-Roller","Basic"]],
    [["B2 Heavy","Rainbow"],["B2-RP","Basic"],["R7","Gold"]],
    [["Util-Tec","Rainbow"],["BB9","Basic"],["Opti-STRK","Basic"]],
    [["Cyclo-Grav","Gold"],["Mecha-Droid","Gold"],["B2-RP","Gold"]],
    [["BB9","Gold"],["R7","Diamond"],["Mecha-Droid","Diamond"]],
    [["R7","Rainbow"],["B2-RP","Rainbow"],["Mono-WLKR","Rainbow"]],
    [["Opti-STRK","Rainbow"],["Cyclo-Grav","Rainbow"],["Mono-WLKR","Rainbow"]],
    [["AMP Walker","Beskar"],["Groundmech","Beskar"],["Haul-R","Beskar"]],
    [["Gunrunner","Beskar"],["Strike-Orb","Beskar"],["B2 Super","Beskar"]],
    [["Mono-WLKR","Beskar"],["Cyclo-Grav","Beskar"],["B2-RP","Beskar"]],
    [["Mecha-Droid","Beskar"],["Proto-Roller","Beskar"],["MO-TRAK","Basic"]],
    [["Opti-STRK","Beskar"],["TRI-TEK","Basic"],["DRFT-R","Gold"]],
    [["CYCLENS","Gold"],["LEP","Diamond"],["MO-TRAK","Rainbow"]],
    [["RIC-1200","Diamond"],["Snow Mouse","Rainbow"],["Loadlifter","Beskar"]],
    [["Opti-STRK","Galactic"],["IG","Rainbow"],["KX","Beskar"]],
    [["BB9","Galactic"],["R7","Galactic"],["TRI-TEK","Beskar"]],

    [["TRAK-R","Stellar"],["Cyclo-Grav","Beskar"],["TRI-TEK","Beskar"]],
    [["R2","Galactic"],["R6","Galactic"],["IG","Beskar"]],
    [["B2 Heavy","Stellar"],["BB9","Galactic"],["RIC-1200","Galactic"]],
    [["Strike-Orb","Stellar"],["AMP Walker","Stellar"],["MO-TRAK","Galactic"]],
    [["B2-RP","Stellar"],["Loadlifter","Stellar"],["LEP","Stellar"]],
    [["B2-RP","Stellar"],["Loadlifter","Stellar"],["LEP","Stellar"]]

};

const KEY = "droidex-v2";
let state = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("droidex-v1") || '{"d":{},"f":{},"i":{},"c":{}}');
if (!state.rb) state.rb = {};
let tab = "droidex";
let srbCycle = Number(state.rb.cycle || 1);

function save(){ localStorage.setItem(KEY, JSON.stringify(state)); updateStats(); }
function dKey(n,v){ return n+"|"+v; }
function has(n,v){ return !!state.d[dKey(n,v)]; }
function toggle(n,v){ state.d[dKey(n,v)] = !state.d[dKey(n,v)]; save(); render(); }
function ownedTiers(n){ return VARIANTS.filter(v => has(n,v)).length; }
function fuseHas(n,v){ return !!state.f[n+"|"+v]; }
function fuseIng(n,v,i){ return !!state.f[n+"|"+v+"|i"+i]; }
function fuseTiers(n){ return VARIANTS.filter(v => fuseHas(n,v)).length; }
function iconOwned(n){ return !!state.i[n]; }
function droidDone(n){ return ownedTiers(n)===7; }
function fuseDone(n){ return fuseTiers(n)===7; }
function iconDone(n){ return iconOwned(n); }
function esc(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function bestTier(n){
  let best = -1;
  VARIANTS.forEach(v => { if (has(n,v) || fuseHas(n,v)) best = Math.max(best, TIER_I[v]); });
  return best;
}
function meets(n, min){ return bestTier(n) >= TIER_I[min]; }

function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h); return Math.abs(h); }
const SHORT = {Basic:"BAS",Gold:"GLD",Diamond:"DIA",Rainbow:"RBW",Beskar:"BSK",Galactic:"GLC",Stellar:"STL"};
function hexFrom(n,s){ const h=hash(n+s); return "#"+((h&0xffffff)|0x202020).toString(16).padStart(6,"0"); }
function portrait(name, typ){
  const h = hash(name);
  const skin = typ==="Worker"||typ==="Fusion" ? "#4ade80" : (typ==="Astromech"||typ==="Iconic" ? "#c4b5fd" : "#fb7185");
  const body = hexFrom(name,"b");
  const acc = hexFrom(name,"a");
  const eye = (h%5)+8;
  if (typ==="Astromech" || typ==="Iconic") {
    return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><ellipse cx="40" cy="28" rx="22" ry="16" fill="${body}"/><rect x="18" y="28" width="44" height="36" rx="8" fill="${body}"/><rect x="22" y="34" width="36" height="8" rx="2" fill="${acc}"/><circle cx="40" cy="24" r="5" fill="${skin}"/><circle cx="40" cy="24" r="2" fill="#0b0818"/><rect x="${eye+10}" y="50" width="${48-eye}" height="4" rx="2" fill="#0b0818"/><rect x="34" y="62" width="12" height="8" fill="${acc}"/></svg>`;
  }
  if (typ==="Battle") {
    return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><rect x="28" y="12" width="24" height="20" rx="6" fill="${body}"/><rect x="22" y="30" width="36" height="28" rx="6" fill="${body}"/><circle cx="34" cy="20" r="3" fill="${skin}"/><circle cx="46" cy="20" r="3" fill="${skin}"/><rect x="18" y="34" width="10" height="22" rx="4" fill="${acc}"/><rect x="52" y="34" width="10" height="22" rx="4" fill="${acc}"/><rect x="30" y="58" width="8" height="16" fill="${body}"/><rect x="42" y="58" width="8" height="16" fill="${body}"/></svg>`;
  }
  return `<svg viewBox="0 0 80 80" class="glyph" style="display:none"><rect width="80" height="80" fill="#12081c"/><rect x="16" y="22" width="48" height="40" rx="8" fill="${body}"/><circle cx="28" cy="38" r="6" fill="#0b0818"/><circle cx="52" cy="38" r="6" fill="#0b0818"/><circle cx="28" cy="38" r="2.5" fill="${skin}"/><circle cx="52" cy="38" r="2.5" fill="${skin}"/><rect x="24" y="50" width="32" height="6" rx="2" fill="${acc}"/><rect x="30" y="14" width="20" height="10" rx="3" fill="${acc}"/></svg>`;
}

function updateStats(){
  const names = DROIDS.filter(([n]) => ownedTiers(n)>0).length + FUSIONS.filter(([n]) => fuseTiers(n)>0).length;
  const totalNames = DROIDS.length + FUSIONS.length;
  const vars = VARIANTS.reduce((a,v)=>a+DROIDS.filter(([n])=>has(n,v)).length,0)
             + VARIANTS.reduce((a,v)=>a+FUSIONS.filter(([n])=>fuseHas(n,v)).length,0);
  const fuse = FUSIONS.filter(([n]) => fuseTiers(n)>0).length;
  const done = DROIDS.filter(([n])=>droidDone(n)).length + FUSIONS.filter(([n])=>fuseDone(n)).length + ICONICS.filter(([n])=>iconDone(n)).length;
  document.getElementById("sNames").textContent = names + "/" + totalNames;
  document.getElementById("sVars").textContent = vars;
  document.getElementById("sFuse").textContent = fuse + "/17";
  document.getElementById("sDone").textContent = done;
}

function showCard(name, typ, extra){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const t = document.getElementById("filter").value;
  if (q && ![name,typ,extra||""].join(" ").toLowerCase().includes(q)) return false;
  if (t!=="all" && typ!==t) return false;
  return true;
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function picWrap(name,typ,rar){
  const file = "img/" + slug(name) + ".jpg";
  return `<div class="pic"><img alt="" src="${file}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">${portrait(name,typ)}</div>`;
}

function renderDroidCard(name,typ,rar,hideDone){
  if (hideDone && droidDone(name)) return "";
  if (!showCard(name,typ,rar)) return "";
  const tiers = ownedTiers(name);
  let html = `<article class="card ${tiers===7?"done":""}"><div class="top">${picWrap(name,typ,rar)}<div class="grow"><div class="name">${name.toUpperCase()}</div><div class="meta">${typ.toUpperCase()} · ${tiers}/7</div></div></div><div class="vars">`;
  VARIANTS.forEach(v => {
    const on = has(name,v);
    html += `<label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="toggle('${esc(name)}','${v}')">${SHORT[v]}</label>`;
  });
  const fl = has(name,"Flawless");
  html += `</div><div class="vars" style="grid-template-columns:1fr;margin-top:6px"><label class="chk ${fl?"on":""}" style="flex-direction:row;min-height:0;padding:6px 8px;text-transform:none;letter-spacing:0;font-size:11px"><input type="checkbox" ${fl?"checked":""} onchange="toggle('${esc(name)}','Flawless')">Flawless</label></div></article>`;
  return html;
}

function renderFusionCard(name,rar,typ,ings,hideDone){
  if (hideDone && fuseDone(name)) return "";
  if (!showCard(name,typ,ings.join(" ")+" fusion")) return "";
  const tiers = fuseTiers(name);
  let html = `<article class="card ${tiers===7?"done":""}"><div class="top">${picWrap(name,"Fusion",rar)}<div class="grow"><div class="name">${name}</div><div class="meta">${typ} · fusion · ${tiers}/7 variants</div></div><span class="badge Fusion">${rar} fusion</span></div>`;
  VARIANTS.forEach(v => {
    const own = fuseHas(name,v);
    const got = ings.map((_,i)=>fuseIng(name,v,i));
    const ready = got.every(Boolean) && !own;
    html += `<div class="tier"><h3><label class="chk ${own?"on":""}" style="background:transparent;border:0;padding:0"><input type="checkbox" ${own?"checked":""} onchange="state.f['${esc(name)}|${v}']=!state.f['${esc(name)}|${v}'];save();render();">${v} ${name}</label>${ready?'<span>READY</span>':''}</h3><div class="ings">`;
    ings.forEach((ing,i) => {
      const on = got[i];
      html += `<label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="state.f['${esc(name)}|${v}|i${i}']=!state.f['${esc(name)}|${v}|i${i}'];save();render();">${v} ${ing}</label>`;
    });
    html += `</div></div>`;
  });
  html += `</article>`;
  return html;
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if (tab==="droidex") {
    html += `<div class="hint">Regular Droidex names. Completed 7/7 droids move to the <b>Done</b> tab. Fusion recipes live on the Fusion tab — they are not missing, they are just a separate list.</div>`;
    let last="", shown=0;
    DROIDS.forEach(([n,t,r]) => {
      if (droidDone(n) || !showCard(n,t,r)) return;
      if (r!==last) { if (last) html += `</div>`; html += `<div class="rarity-h ${r}">${r}</div><div class="grid">`; last=r; }
      html += renderDroidCard(n,t,r,true); shown++;
    });
    if (last) html += `</div>`;
    if (!shown) html += `<div class="empty">Nothing left here. Check Done, or clear search.</div>`;
  }
  if (tab==="fusion") {
    html += `<div class="hint">17 fusion-only names. Each variant needs the <b>same-tier ingredients</b>. Example: Gold N-UL wants Gold B1 Heavy + Gold Gunrunner + Gold BB. Check the three parts, then check the result. 7/7 moves to Done.</div>`;
    let last="", shown=0;
    FUSIONS.forEach(([n,r,t,ings]) => {
      if (fuseDone(n) || !showCard(n,t,ings.join(" "))) return;
      if (r!==last) { html += `<div class="rarity-h ${r}">${r} fusion</div>`; last=r; }
      html += renderFusionCard(n,r,t,ings,true); shown++;
    });
    if (!shown) html += `<div class="empty">All fusion droids are complete, or none match the filter.</div>`;
  }
  if (tab==="srb") {
    const cyc = CYCLES[srbCycle] || CYCLES[1];
    html += `<div class="hint">Super Rebirth unlocks at <b>Rebirth 12</b> plus one Rainbow Legendary. Cash-out walks you Cycle 1→2→3→4→1. First SRB usually puts you on Cycle 2. Credits are the same every cycle. Confirm the live board if a mid-cycle row looks off after a patch.</div>`;
    html += `<div class="cycles">`;
    [1,2,3,4].forEach(n => {
      html += `<button class="${srbCycle===n?"on":""}" onclick="srbCycle=${n};state.rb.cycle=${n};save();render();">Cycle ${n}</button>`;
    });
    html += `</div>`;
    cyc.forEach((need, idx) => {
      const rb = idx+1;
      const blob = need.map(x=>x.join(" ")).join(" ");
      const qq = document.getElementById("q").value.trim().toLowerCase();
      if (qq && !("rebirth "+rb+" "+blob+" "+CREDITS[idx]).toLowerCase().includes(qq)) return;
      const key = "c"+srbCycle+"r"+rb;
      const done = !!state.rb[key];
      const ready = need.every(([n,t]) => meets(n,t));
      const nova = NOVA[rb] ? ` · SRB ${NOVA[rb]} Nova` : "";
      html += `<article class="card ${done?"done":""}"><div class="rb-row"><div class="rb-head"><div><div class="name">Rebirth ${rb}</div><div class="meta">${ready?"Collection covers this row":"Need these in base at min tier"}</div></div><div class="rb-cost">${CREDITS[idx]}${nova}</div></div><div class="ings">`;
      need.forEach(([n,t]) => {
        const ok = meets(n,t);
        html += `<label class="chk ${ok?"on":""}">${ok?"✓":"○"} ${t} ${n}</label>`;
      });
      html += `<label class="chk ${done?"on":""}"><input type="checkbox" ${done?"checked":""} onchange="state.rb['${key}']=!state.rb['${key}'];save();render();">Cleared this rebirth</label>`;
      if (rb>=12) html += `<div class="srb">CAN SUPER REBIRTH HERE</div>`;
      html += `</div></div></article>`;
    });
  }
  if (tab==="more") {
    html += `<div class="hint">Iconics and workshop fashion.</div><div class="rarity-h Iconic">Iconics</div>`;
    ICONICS.forEach(([n,t,ev,how]) => {
      if (iconDone(n) || !showCard(n,t,ev+" "+how)) return;
      const base = !!state.i[n+"|base"];
      html += `<article class="card"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars">
        <label class="chk"><input type="checkbox" onchange="state.i['${esc(n)}']=!state.i['${esc(n)}'];save();render();">Owned</label>
        <label class="chk ${base?"on":""}"><input type="checkbox" ${base?"checked":""} onchange="state.i['${esc(n)}|base']=!state.i['${esc(n)}|base'];save();render();">In base</label>
      </div></article>`;
    });
    html += `<div class="rarity-h">Fashion</div>`;
    COSMETICS.forEach(([cat,item,how,cost],idx) => {
      if (!showCard(item,cat,how+" "+cost)) return;
      const on = !!state.c[idx];
      html += `<article class="card ${on?"done":""}"><div class="top"><div class="grow"><div class="name">${item}</div><div class="meta">${cat} · ${cost}</div></div></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars"><label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="state.c[${idx}]=!state.c[${idx}];save();render();">Have it</label></div></article>`;
    });
  }
  if (tab==="iconics") {
    html += `<div class="hint">Event-only named droids. Owned iconics move to Done.</div>`;
    let shown=0;
    ICONICS.forEach(([n,t,ev,how]) => {
      if (iconDone(n) || !showCard(n,t,ev+" "+how)) return;
      const base = !!state.i[n+"|base"];
      html += `<article class="card"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars">
        <label class="chk"><input type="checkbox" onchange="state.i['${esc(n)}']=!state.i['${esc(n)}'];save();render();">Owned</label>
        <label class="chk ${base?"on":""}"><input type="checkbox" ${base?"checked":""} onchange="state.i['${esc(n)}|base']=!state.i['${esc(n)}|base'];save();render();">In base</label>
      </div></article>`;
      shown++;
    });
    if (!shown) html += `<div class="empty">All iconics owned, or none match the filter.</div>`;
  }
  if (tab==="done") {
    html += `<div class="hint">Finished names only. Uncheck a variant on a card to send it back to its main tab.</div>`;
    let shown=0;
    const doneD = DROIDS.filter(([n])=>droidDone(n));
    const doneF = FUSIONS.filter(([n])=>fuseDone(n));
    const doneI = ICONICS.filter(([n])=>iconDone(n));
    if (doneD.length){ html += `<div class="rarity-h">Regular</div>`; doneD.forEach(([n,t,r]) => { html += renderDroidCard(n,t,r,false); shown++; }); }
    if (doneF.length){ html += `<div class="rarity-h Fusion">Fusion</div>`; doneF.forEach(([n,r,t,ings]) => { html += renderFusionCard(n,r,t,ings,false); shown++; }); }
    if (doneI.length){
      html += `<div class="rarity-h Iconic">Iconic</div>`;
      doneI.forEach(([n,t,ev,how]) => {
        if (!showCard(n,t,ev)) return;
        html += `<article class="card done"><div class="top">${picWrap(n,"Iconic","Iconic")}<div class="grow"><div class="name">${n}</div><div class="meta">${t} · ${ev}</div></div><span class="badge Iconic">Iconic</span></div><div class="vars"><label class="chk on"><input type="checkbox" checked onchange="state.i['${esc(n)}']=false;save();render();">Owned</label></div></article>`;
        shown++;
      });
    }
    if (!shown) html += `<div class="empty">Nothing completed yet. Finish all 7 variants on a droid, or own an iconic.</div>`;
  }
  if (tab==="cosmetics") {
    html += `<div class="hint">Workshop fashion. These are not Droidex entries.</div>`;
    COSMETICS.forEach(([cat,item,how,cost],idx) => {
      if (!showCard(item,cat,how+" "+cost)) return;
      const on = !!state.c[idx];
      html += `<article class="card ${on?"done":""}"><div class="top"><div class="grow"><div class="name">${item}</div><div class="meta">${cat} · ${cost}</div></div></div><div class="meta" style="margin-top:8px">${how}</div><div class="vars"><label class="chk ${on?"on":""}"><input type="checkbox" ${on?"checked":""} onchange="state.c[${idx}]=!state.c[${idx}];save();render();">Have it</label></div></article>`;
    });
  }
  app.innerHTML = html;
  updateStats();
}

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    tab = btn.dataset.tab;
    render();
    window.scrollTo(0,0);
  };
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);
render();
</script>
</body>
</html>
